<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Portal Live Wallpaper</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    font-family: Arial, sans-serif;
}

#scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 116, 20, 0.045) 0%,
            rgba(255, 92, 8, 0.022) 12%,
            rgba(0, 0, 0, 0) 42%
        ),
        #000;
}

#camera {
    position: absolute;
    inset: 0;
    transform: translate3d(0,0,0) scale(1);
    will-change: transform;
}

#portal {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(58vw, 700px);
    height: min(58vw, 700px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
}

.portal-ring {
    position: absolute;
    inset: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
}

.ring-outer {
    width: 100%;
    height: 100%;
    border: 1px solid rgba(255, 132, 35, 0.075);
    box-shadow:
        0 0 18px rgba(255, 110, 15, 0.035),
        inset 0 0 18px rgba(255, 110, 15, 0.025);
    animation: rotateSlow 42s linear infinite;
}

.ring-mid {
    width: 82%;
    height: 82%;
    border: 1px solid rgba(255, 188, 110, 0.055);
    border-left-color: rgba(255, 156, 50, 0.16);
    border-right-color: rgba(255, 156, 50, 0.10);
    box-shadow:
        0 0 22px rgba(255, 125, 30, 0.04),
        inset 0 0 22px rgba(255, 125, 30, 0.02);
    animation: rotateReverse 28s linear infinite;
}

.ring-inner {
    width: 64%;
    height: 64%;
    border: 1px dashed rgba(255, 191, 130, 0.055);
    box-shadow:
        0 0 30px rgba(255, 123, 20, 0.04),
        inset 0 0 30px rgba(255, 123, 20, 0.03);
    animation: rotateSlow 19s linear infinite;
}

.ring-core {
    width: 41%;
    height: 41%;
    border: 1px solid rgba(255, 127, 20, 0.075);
    box-shadow:
        0 0 35px rgba(255, 90, 0, 0.055),
        inset 0 0 28px rgba(255, 102, 0, 0.045);
    animation: breatheRing 4.5s ease-in-out infinite;
}

@keyframes rotateSlow {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

@keyframes rotateReverse {
    from {
        transform: translate(-50%, -50%) rotate(360deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(0deg);
    }
}

@keyframes breatheRing {
    0%,100% {
        transform: translate(-50%, -50%) scale(.96);
        opacity: .55;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 1;
    }
}

#energy {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(28vw, 360px);
    height: min(28vw, 360px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.055) 0%,
            rgba(255,205,145,.04) 10%,
            rgba(255,128,20,.028) 24%,
            rgba(255,80,0,0) 68%
        );
    filter: blur(4px);
    animation: energyPulse 3.8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes energyPulse {
    0%,100% {
        transform: translate(-50%, -50%) scale(.82);
        opacity: .35;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.12);
        opacity: .9;
    }
}

#shockwave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%) scale(.1);
    border-radius: 50%;
    border: 1px solid rgba(255,173,90,.5);
    box-shadow:
        0 0 15px rgba(255,109,12,.35),
        inset 0 0 15px rgba(255,150,60,.2);
    opacity: 0;
    pointer-events: none;
}

#shockwave.active {
    animation: shockwave 2s ease-out forwards;
}

@keyframes shockwave {
    0% {
        transform: translate(-50%, -50%) scale(.1);
        opacity: .7;
    }

    45% {
        opacity: .3;
    }

    100% {
        transform: translate(-50%, -50%) scale(7);
        opacity: 0;
    }
}

#rune {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(23vw, 290px);
    height: min(23vw, 290px);
    min-width: 155px;
    min-height: 155px;
    max-width: 290px;
    max-height: 290px;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    will-change: opacity, transform, filter;
}

#rune svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.rune-path {
    fill: none;
    stroke: url(#dynamicGlow);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.rune-thin {
    fill: none;
    stroke: #fff8ee;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.rune-orange {
    fill: none;
    stroke: #ff861b;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.rune-solid {
    fill: #fffaf2;
}

#rune.animate {
    animation: runeLife 2s cubic-bezier(.22,.8,.22,1) forwards;
}

@keyframes runeLife {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.78) rotate(-5deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,110,0,0));
    }

    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        filter:
            drop-shadow(0 0 4px rgba(255,255,255,1))
            drop-shadow(0 0 10px rgba(255,237,210,.95))
            drop-shadow(0 0 22px rgba(255,155,45,.9))
            drop-shadow(0 0 45px rgba(255,85,0,.65));
    }

    67% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        filter:
            drop-shadow(0 0 5px rgba(255,255,255,1))
            drop-shadow(0 0 11px rgba(255,231,195,1))
            drop-shadow(0 0 25px rgba(255,145,35,.95))
            drop-shadow(0 0 52px rgba(255,76,0,.68));
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.08) rotate(4deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,110,0,0));
    }
}

#glyphs {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(53vw, 640px);
    height: min(53vw, 640px);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    animation: glyphRotation 70s linear infinite;
}

@keyframes glyphRotation {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

.glyph {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center;
    color: rgba(255,210,170,.10);
    font-family: Georgia, serif;
    font-size: clamp(14px, 1.5vw, 22px);
    text-shadow:
        0 0 4px rgba(255,255,255,.10),
        0 0 12px rgba(255,110,0,.10);
    opacity: .35;
}

#particles {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255,210,160,.5);
    box-shadow:
        0 0 5px rgba(255,160,60,.45),
        0 0 11px rgba(255,100,20,.20);
    animation: particleFloat linear infinite;
}

@keyframes particleFloat {
    0% {
        transform: translate3d(0,0,0) scale(.4);
        opacity: 0;
    }

    15% {
        opacity: .6;
    }

    50% {
        opacity: .25;
    }

    85% {
        opacity: .5;
    }

    100% {
        transform: translate3d(var(--dx),var(--dy),0) scale(1.2);
        opacity: 0;
    }
}

#dust {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.03) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(255,160,70,.025) 0 1px, transparent 1px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.02) 0 1px, transparent 1px);
    background-size: 170px 170px, 240px 240px, 310px 310px;
    animation: dustShift 30s linear infinite;
    opacity: .55;
}

@keyframes dustShift {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-80px,50px);
    }
}

#vignette {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.18) 61%,
            rgba(0,0,0,.48) 100%
        );
}

#scan {
    position: absolute;
    inset: 0;
    z-index: 21;
    pointer-events: none;
    opacity: .035;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,180,100,.15) 4px
        );
    mix-blend-mode: screen;
}

@media (max-width: 600px) {
    #rune {
        width: 56vw;
        height: 56vw;
    }

    #portal {
        width: 90vw;
        height: 90vw;
    }

    #glyphs {
        width: 86vw;
        height: 86vw;
    }
}
</style>
</head>

`<svg viewBox="0 0 220 220">
<defs><linearGradient id="dynamicGlow"><stop stop-color="#ff6b0d"/><stop offset=".5" stop-color="#ffd8ab"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
<path class="rune-path" d="M54 58L110 30L166 58V162L110 190L54 162Z"/>
<path class="rune-thin" d="M54 58L110 88L166 58M54 162L110 132L166 162M110 30V190"/>

<circle class="rune-solid" cx="110" cy="110" r="5"/>

];

const rune = document.getElementById("rune");
const shockwave = document.getElementById("shockwave");
const glyphs = document.getElementById("glyphs");
const particles = document.getElementById("particles");
const camera = document.getElementById("camera");

let runeIndex = 0;

const glyphSet = [
    "ᚦ","ᚨ","ᛉ","ᛟ","ᚱ","ᚲ","ᛏ","ᚹ",
    "ϟ","Ψ","Ж","Ȝ","Ƶ","ƛ","⟐","⟁",
    "⟡","◈","⊙","⌁","⋔","ᛝ","ᚾ","ᛒ"
];

glyphSet.forEach((char, i) => {
    const el = document.createElement("div");
    el.className = "glyph";
    el.textContent = char;

    const angle = i * (360 / glyphSet.length);
    const radius = 47 + (i % 3) * 2.2;

    el.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}%) rotate(${-angle}deg)`;

    el.style.opacity = (0.14 + (i % 4) * 0.035).toFixed(2);
    glyphs.appendChild(el);
});

for (let i = 0; i < 90; i++) {
    const p = document.createElement("div");
    p.className = "particle";

    const x = Math.random() * 100;
    const y = Math.random() * 100;

    const dx = (Math.random() * 160 - 80).toFixed(1);
    const dy = (Math.random() * -180 - 25).toFixed(1);

    p.style.left = x + "%";
    p.style.top = y + "%";
    p.style.setProperty("--dx", dx + "px");
    p.style.setProperty("--dy", dy + "px");
    p.style.animationDuration = (4 + Math.random() * 10).toFixed(2) + "s";
    p.style.animationDelay = (-Math.random() * 12).toFixed(2) + "s";

    const size = (Math.random() * 2.2 + .7).toFixed(2);
    p.style.width = size + "px";
    p.style.height = size + "px";

    particles.appendChild(p);
}

function showRune() {
    rune.classList.remove("animate");
    void rune.offsetWidth;

    rune.innerHTML = runes[runeIndex];
    rune.classList.add("animate");

    shockwave.classList.remove("active");
    void shockwave.offsetWidth;
    shockwave.classList.add("active");

    runeIndex = (runeIndex + 1) % runes.length;
}

showRune();
setInterval(showRune, 2000);

let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener("mousemove", e => {
    targetX = (e.clientX / window.innerWidth - 0.5) * 2;
    targetY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function animateCamera() {
    mouseX += (targetX - mouseX) * 0.025;
    mouseY += (targetY - mouseY) * 0.025;

    const t = performance.now() * 0.00025;

    const driftX = Math.sin(t) * 2.2;
    const driftY = Math.cos(t * 1.13) * 2.2;

    const x = driftX + mouseX * 3;
    const y = driftY + mouseY * 3;

    const scale = 1.005 + Math.sin(t * .7) * 0.002;

    camera.style.transform =
        `translate3d(${x}px, ${y}px, 0) scale(${scale})`;

    requestAnimationFrame(animateCamera);
}

animateCamera();

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        camera.style.animationPlayState = "paused";
    }
});

window.addEventListener("resize", () => {
    camera.style.transform = "translate3d(0,0,0) scale(1)";
});
</script>
