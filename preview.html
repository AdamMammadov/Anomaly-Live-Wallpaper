<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Runes Live Wallpaper</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: none;
}

#scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center,
            rgba(255, 130, 30, 0.025) 0%,
            rgba(255, 90, 0, 0.012) 15%,
            rgba(0, 0, 0, 0) 42%),
        #000;
}

#rune {
    width: min(24vw, 300px);
    height: min(24vw, 300px);
    min-width: 150px;
    min-height: 150px;
    max-width: 300px;
    max-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.95))
        drop-shadow(0 0 12px rgba(255,220,160,.95))
        drop-shadow(0 0 24px rgba(255,150,40,.9))
        drop-shadow(0 0 46px rgba(255,90,0,.55));
    will-change: transform, filter, opacity;
}

#rune svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

#rune svg * {
    vector-effect: non-scaling-stroke;
}

#rune.animate {
    animation: runeCycle 2s ease-in-out forwards;
}

@keyframes runeCycle {
    0% {
        opacity: 0;
        transform: scale(.88) rotate(-3deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,150,40,0));
    }

    17% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter:
            drop-shadow(0 0 5px rgba(255,255,255,1))
            drop-shadow(0 0 12px rgba(255,220,160,1))
            drop-shadow(0 0 24px rgba(255,150,40,.95))
            drop-shadow(0 0 46px rgba(255,90,0,.65));
    }

    72% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter:
            drop-shadow(0 0 5px rgba(255,255,255,1))
            drop-shadow(0 0 12px rgba(255,220,160,1))
            drop-shadow(0 0 24px rgba(255,150,40,.95))
            drop-shadow(0 0 46px rgba(255,90,0,.65));
    }

    100% {
        opacity: 0;
        transform: scale(1.08) rotate(3deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,150,40,0));
    }
}

#pulse {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(38vw, 500px);
    height: min(38vw, 500px);
    min-width: 240px;
    min-height: 240px;
    max-width: 500px;
    max-height: 500px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(
        circle,
        rgba(255, 190, 90, .045) 0%,
        rgba(255, 120, 30, .022) 25%,
        rgba(255, 80, 0, 0) 68%
    );
    animation: ambientPulse 4s ease-in-out infinite;
}

@keyframes ambientPulse {
    0%, 100% {
        transform: translate(-50%, -50%) scale(.82);
        opacity: .25;
    }
    50% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: .55;
    }
}

.rune-path {
    stroke: url(#glowGradient);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.rune-thin {
    stroke: #fff7ed;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.rune-solid {
    fill: #fffaf3;
    stroke: none;
}

.rune-orange {
    stroke: #ff8a1c;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

@media (max-width: 600px) {
    #rune {
        width: 58vw;
        height: 58vw;
    }

    #pulse {
        width: 82vw;
        height: 82vw;
    }
}
</style>
</head>

const pulse = document.getElementById("pulse");

let index = 0;

function showRune() {
    rune.classList.remove("animate");
    void rune.offsetWidth;
    rune.innerHTML = runes[index];
    rune.classList.add("animate");

    index = (index + 1) % runes.length;
}

showRune();
setInterval(showRune, 2000);

window.addEventListener("resize", () => {
    rune.style.transform = "scale(1)";
});

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        pulse.style.animationPlayState = "paused";
    } else {
        pulse.style.animationPlayState = "running";
    }
});
