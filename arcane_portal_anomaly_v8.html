<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARCANE PORTAL — Dimensional Anomaly V8</title>
<meta name="description" content="An ambient, real-time arcane portal with reactive dimensional anomalies.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ff720d' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffc27c'/%3E%3C/svg%3E">

<style>
:root{
    --coreOrange:#ff720d;
    --coreGold:#ffc27c;
    --anomCyan:#00eaff;
    --anomBlue:#458cff;
    --anomViolet:#8b5cff;
    --anomMagenta:#ff35d5;
}

*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
}

body{
    position:relative;
    cursor:none;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
}

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,104,10,.055) 0%,transparent 24%),
        radial-gradient(circle at 50% 50%,rgba(255,140,40,.024) 0%,transparent 46%),
        #000;
}

#camera{
    position:absolute;
    inset:-2%;
    transform-origin:center;
    will-change:transform;
}

#anomalyCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:4;
    pointer-events:none;
}

#stars,#particles,#rays,#glyphs,#sparks{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#stars{z-index:1}
#rays{z-index:2}
#glyphs{z-index:3}
#particles{z-index:5}
#sparks{z-index:14}

.star{
    position:absolute;
    width:1px;
    height:1px;
    border-radius:50%;
    background:rgba(255,223,195,.72);
    box-shadow:0 0 6px rgba(255,130,30,.36);
    animation:twinkle var(--d) ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.025;transform:scale(.3)}
    50%{opacity:var(--o);transform:scale(1.8)}
}

.ray{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:46vh;
    transform-origin:50% 100%;
    background:linear-gradient(to top,rgba(255,145,35,0),rgba(255,194,112,.02),rgba(255,235,205,.12),rgba(255,100,0,0));
    filter:blur(1px);
    opacity:.12;
}

#portal{
    position:absolute;
    left:50%;
    top:50%;
    width:min(68vmin,800px);
    height:min(68vmin,800px);
    transform:translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,165,80,.08);
}

.r1{
    width:100%;
    height:100%;
    border-color:rgba(255,125,20,.07);
    box-shadow:0 0 24px rgba(255,100,0,.025),inset 0 0 24px rgba(255,100,0,.022);
    animation:spin1 52s linear infinite;
}

.r2{
    width:92%;
    height:92%;
    border-style:dashed;
    border-color:rgba(255,215,175,.055);
    animation:spin2 36s linear infinite reverse;
}

.r3{
    width:79%;
    height:79%;
    border-color:rgba(255,140,35,.12);
    box-shadow:0 0 38px rgba(255,100,0,.05),inset 0 0 30px rgba(255,105,0,.036);
    animation:spin1 26s linear infinite;
}

.r4{
    width:66%;
    height:66%;
    border-style:dotted;
    border-color:rgba(255,220,190,.085);
    animation:spin2 18s linear infinite reverse;
}

.r5{
    width:53%;
    height:53%;
    border-color:rgba(255,118,15,.13);
    animation:spin1 13s linear infinite;
}

@keyframes spin1{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes spin2{
    from{transform:translate(-50%,-50%) rotate(360deg)}
    to{transform:translate(-50%,-50%) rotate(0)}
}

#ticks{
    position:absolute;
    left:50%;
    top:50%;
    width:97%;
    height:97%;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

.tick{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:10px;
    transform-origin:0 0;
    background:rgba(255,183,115,.15);
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    border:1px solid rgba(255,180,105,.055);
    transform:translate(-50%,-50%) rotateX(68deg);
}

.orbit.a{
    width:84%;
    height:30%;
    animation:orbitA 17s linear infinite;
}

.orbit.b{
    width:70%;
    height:24%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg);
    animation:orbitB 23s linear infinite reverse;
}

.orbit.c{
    width:60%;
    height:20%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg);
    animation:orbitC 19s linear infinite;
}

.orbit-dot{
    position:absolute;
    left:50%;
    top:-4px;
    width:7px;
    height:7px;
    margin-left:-3.5px;
    border-radius:50%;
    background:#fff8ed;
    box-shadow:0 0 6px #fff,0 0 16px #ffae5a,0 0 30px #ff6500;
}

@keyframes orbitA{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(0)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg)}
}
@keyframes orbitB{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-300deg)}
}
@keyframes orbitC{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(302deg)}
}

#coreGlow{
    position:absolute;
    left:50%;
    top:50%;
    width:46%;
    height:46%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.15),rgba(255,211,164,.08) 11%,rgba(255,112,10,.05) 32%,transparent 70%);
    filter:blur(7px);
    animation:corePulse 3.7s ease-in-out infinite;
}

#coreBlack{
    position:absolute;
    left:50%;
    top:50%;
    width:28%;
    height:28%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#000;
    box-shadow:0 0 24px rgba(255,105,8,.18),0 0 68px rgba(255,72,0,.09),inset 0 0 20px rgba(255,120,20,.07);
}

#portalOpen{
    position:absolute;
    left:50%;
    top:50%;
    width:37%;
    height:37%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,194,124,.08);
    border-radius:50%;
    box-shadow:0 0 18px rgba(255,115,15,.035),inset 0 0 25px rgba(255,100,0,.035);
    animation:openPortal 2.8s ease-in-out infinite;
}

@keyframes corePulse{
    0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.28}
    50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}

@keyframes openPortal{
    0%,100%{transform:translate(-50%,-50%) scale(.86);opacity:.4}
    50%{transform:translate(-50%,-50%) scale(1.07);opacity:1}
}

#rune{
    position:absolute;
    left:50%;
    top:50%;
    width:min(27vmin,335px);
    height:min(27vmin,335px);
    min-width:155px;
    min-height:155px;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:18;
    will-change:transform,opacity,filter;
}

#rune svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.rune-path{
    fill:none;
    stroke:url(#g);
    stroke-width:7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-thin{
    fill:none;
    stroke:#fff9f0;
    stroke-width:3.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-orange{
    fill:none;
    stroke:#ff7914;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-solid{fill:#fffaf0}

#rune.show{
    animation:runeShow 2s cubic-bezier(.18,.8,.2,1) forwards;
}

@keyframes runeShow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.62) rotate(-12deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 4px rgba(255,255,255,1)) drop-shadow(0 0 10px rgba(255,226,190,1)) drop-shadow(0 0 22px rgba(255,155,50,.95)) drop-shadow(0 0 48px rgba(255,74,0,.72))}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 5px rgba(255,255,255,1)) drop-shadow(0 0 13px rgba(255,221,180,1)) drop-shadow(0 0 27px rgba(255,147,40,1)) drop-shadow(0 0 62px rgba(255,67,0,.78))}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.14) rotate(8deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}
}

#glyphs{
    width:min(55vmin,660px);
    height:min(55vmin,660px);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation:glyphSpin 86s linear infinite;
}

@keyframes glyphSpin{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

.glyph{
    position:absolute;
    left:50%;
    top:50%;
    color:rgba(255,211,171,.15);
    font-family:Georgia,serif;
    text-shadow:0 0 7px rgba(255,255,255,.10),0 0 18px rgba(255,100,0,.13);
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,215,180,.72);
    box-shadow:0 0 5px rgba(255,255,255,.4),0 0 12px rgba(255,120,20,.28);
    animation:particleMove var(--dur) linear infinite;
}

@keyframes particleMove{
    0%{transform:translate3d(0,0,0) scale(.2);opacity:0}
    15%{opacity:.6}
    50%{opacity:.25}
    82%{opacity:.65}
    100%{transform:translate3d(var(--x),var(--y),0) scale(1.7);opacity:0}
}

.spark{
    position:absolute;
    left:50%;
    top:50%;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px #fff,0 0 18px #ffad5c,0 0 35px #ff6500;
    opacity:0;
}

.spark.go{animation:spark 1.4s ease-out forwards}

@keyframes spark{
    0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(8px) scale(.2);opacity:1}
    100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) scale(0);opacity:0}
}

#pulse{
    position:absolute;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    transform:translate(-50%,-50%) scale(.1);
    border:1px solid rgba(255,190,120,.5);
    border-radius:50%;
    opacity:0;
    z-index:10;
}

#pulse.go{animation:pulse 2s ease-out forwards}

@keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(.1);opacity:.75}
    38%{opacity:.3}
    100%{transform:translate(-50%,-50%) scale(8);opacity:0}
}

#flash{
    position:absolute;
    inset:0;
    z-index:42;
    opacity:0;
    pointer-events:none;
    background:radial-gradient(circle at center,rgba(255,255,255,.10),rgba(255,124,25,.03) 19%,transparent 48%);
}

#flash.go{animation:flash .95s ease-out forwards}

@keyframes flash{
    0%{opacity:.72}
    100%{opacity:0}
}

#distortion{
    position:absolute;
    inset:0;
    z-index:45;
    pointer-events:none;
    opacity:.032;
    background:repeating-linear-gradient(to bottom,rgba(255,165,85,.10) 0,rgba(255,165,85,.10) 1px,transparent 2px,transparent 5px);
    mix-blend-mode:screen;
}

#vignette{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.68) 100%);
}

#soundHint{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:100;
    color:rgba(255,222,190,.6);
    font:italic clamp(12px,1.35vmin,15px)/1.5 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    letter-spacing:.1em;
    white-space:nowrap;
    text-shadow:0 0 14px rgba(255,110,10,.35);
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
}

#soundHint.visible{opacity:1}


#anomalyAura{
    position:absolute;
    left:50%;
    top:50%;
    width:min(48vmin,560px);
    height:min(48vmin,560px);
    transform:translate(-50%,-50%) scale(.88);
    border-radius:50%;
    pointer-events:none;
    z-index:6;
    opacity:0;
    background:radial-gradient(circle,
        color-mix(in srgb,var(--anom1,#00eaff) 16%,transparent) 0%,
        color-mix(in srgb,var(--anom2,#ff35d5) 7%,transparent) 30%,
        transparent 70%);
    filter:blur(4px);
    mix-blend-mode:screen;
    transition:opacity .35s ease,transform .65s cubic-bezier(.16,.8,.2,1),filter .35s ease;
}

#anomalyAura.active{
    opacity:var(--anom-intensity,.35);
    transform:translate(-50%,-50%) scale(calc(.88 + var(--anom-scale,0)));
}

#eventShock{
    position:absolute;
    left:50%;
    top:50%;
    width:110px;
    height:110px;
    transform:translate(-50%,-50%) scale(.1);
    border-radius:50%;
    border:1px solid var(--anom1,#00eaff);
    box-shadow:0 0 15px var(--anom1,#00eaff),0 0 38px var(--anom2,#ff35d5);
    opacity:0;
    z-index:16;
    pointer-events:none;
    mix-blend-mode:screen;
}

#eventShock.go{
    animation:eventShock .95s cubic-bezier(.15,.75,.2,1) forwards;
}

@keyframes eventShock{
    0%{transform:translate(-50%,-50%) scale(.08);opacity:.72}
    34%{opacity:.4}
    100%{transform:translate(-50%,-50%) scale(4.4);opacity:0}
}

#portal.reactive{
    animation:portalReaction .85s cubic-bezier(.15,.8,.2,1);
}

@keyframes portalReaction{
    0%{filter:brightness(1);transform:translate(-50%,-50%) scale(1)}
    20%{filter:brightness(1.45) saturate(1.18);transform:translate(-50%,-50%) scale(1.028)}
    55%{filter:brightness(1.15);transform:translate(-50%,-50%) scale(1.012)}
    100%{filter:brightness(1);transform:translate(-50%,-50%) scale(1)}
}

@supports not (background:color-mix(in srgb, red 10%, transparent)){
    #anomalyAura{
        background:radial-gradient(circle,rgba(0,234,255,.10),rgba(255,53,213,.035) 30%,transparent 70%);
    }
}

@media(max-width:1100px){
    #anomalyCanvas{opacity:.94}
}

@media(max-width:700px){
    #portal{width:83vmin;height:83vmin}
    #rune{width:34vmin;height:34vmin}
    #glyphs{width:74vmin;height:74vmin}
}

/* ═══════════ V7 ═══════════ */

/* Event-horizon swirl around the black core */
#swirl,#swirl2{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    pointer-events:none;
    mix-blend-mode:screen;
    -webkit-mask:radial-gradient(closest-side,transparent 66%,#000 76%,#000 86%,transparent 97%);
    mask:radial-gradient(closest-side,transparent 66%,#000 76%,#000 86%,transparent 97%);
}
#swirl{
    width:41%;
    height:41%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,rgba(255,110,10,0) 0deg,rgba(255,150,40,.5) 50deg,rgba(255,236,206,.85) 95deg,rgba(255,120,20,0) 150deg,rgba(255,90,0,0) 190deg,rgba(255,160,60,.35) 250deg,rgba(255,120,20,0) 310deg,rgba(255,110,10,0) 360deg);
    filter:blur(1.2px);
    opacity:.85;
    animation:swirlA 9s linear infinite;
}
#swirl2{
    width:45%;
    height:45%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 90deg,rgba(0,234,255,0) 0deg,rgba(0,234,255,.5) 70deg,rgba(0,234,255,0) 140deg,rgba(255,53,213,0) 200deg,rgba(255,53,213,.45) 270deg,rgba(255,53,213,0) 340deg,rgba(0,234,255,0) 360deg);
    background:conic-gradient(from 90deg,transparent 0deg,color-mix(in srgb,var(--anom1,#00eaff) 70%,transparent) 70deg,transparent 140deg,transparent 200deg,color-mix(in srgb,var(--anom2,#ff35d5) 60%,transparent) 270deg,transparent 340deg,transparent 360deg);
    filter:blur(2px);
    opacity:.5;
    animation:swirlB 14s linear infinite;
}
@keyframes swirlA{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes swirlB{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0)}}

#rays{animation:raySpin 160s linear infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}

/* Film grain */
#grain{
    position:absolute;
    inset:-60px;
    z-index:46;
    pointer-events:none;
    opacity:.06;
    background-size:160px 160px;
    animation:grain .8s steps(1) infinite;
}
@keyframes grain{
    0%{transform:translate(0,0)}
    20%{transform:translate(-37px,23px)}
    40%{transform:translate(29px,-41px)}
    60%{transform:translate(-19px,-33px)}
    80%{transform:translate(41px,17px)}
    100%{transform:translate(0,0)}
}

/* Chromatic glitch when the anomalies change */
#anomalyCanvas.glitch{animation:canvasGlitch .34s steps(2,end)}
@keyframes canvasGlitch{
    0%{transform:translate(0,0);filter:none}
    20%{transform:translate(-4px,1px);filter:drop-shadow(4px 0 rgba(255,30,150,.55)) drop-shadow(-4px 0 rgba(0,240,255,.55))}
    45%{transform:translate(5px,-2px);filter:drop-shadow(-5px 0 rgba(255,30,150,.5)) drop-shadow(5px 0 rgba(0,240,255,.5))}
    70%{transform:translate(-2px,0);filter:drop-shadow(2px 0 rgba(255,30,150,.4)) drop-shadow(-2px 0 rgba(0,240,255,.4))}
    100%{transform:translate(0,0);filter:none}
}

/* Anomaly names */
#hud{
    position:absolute;
    inset:0;
    z-index:60;
    pointer-events:none;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    transition:opacity .9s ease;
}
.hud-side{
    position:absolute;
    top:clamp(18px,5.2vh,56px);
    left:clamp(16px,3.6vw,64px);
    max-width:42vw;
}
.hud-side.r{left:auto;right:clamp(16px,3.6vw,64px);text-align:right}
.hud-name{
    display:block;
    min-height:1.4em;
    font-style:italic;
    font-size:clamp(13px,1.7vmin,20px);
    letter-spacing:.12em;
    color:rgba(255,226,196,.72);
    text-shadow:0 0 12px rgba(0,234,255,.35);
    text-shadow:0 0 14px color-mix(in srgb,var(--anom1,#00eaff) 55%,transparent);
}
.hud-name.swap{animation:nameIn 1s cubic-bezier(.16,.8,.2,1) both}
@keyframes nameIn{
    0%{opacity:0;filter:blur(7px);transform:translateX(-10px)}
    28%{opacity:1;filter:blur(0);text-shadow:2px 0 rgba(255,40,180,.9),-2px 0 rgba(0,240,255,.9)}
    100%{opacity:1;filter:blur(0);transform:none}
}
.hud-side.r .hud-name.swap{animation-name:nameInR}
@keyframes nameInR{
    0%{opacity:0;filter:blur(7px);transform:translateX(10px)}
    28%{opacity:1;filter:blur(0);text-shadow:2px 0 rgba(255,40,180,.9),-2px 0 rgba(0,240,255,.9)}
    100%{opacity:1;filter:blur(0);transform:none}
}
.hud-bar{
    display:block;
    position:relative;
    overflow:hidden;
    height:1px;
    width:clamp(70px,9vw,150px);
    margin-top:10px;
    background:rgba(255,200,150,.12);
}
.hud-side.r .hud-bar{margin-left:auto}
.hud-bar b{
    position:absolute;
    inset:0;
    transform-origin:0 50%;
    transform:scaleX(0);
    background:linear-gradient(90deg,rgba(255,255,255,0),var(--anom1,#00eaff));
}
.hud-side.r .hud-bar b{transform-origin:100% 50%;background:linear-gradient(270deg,rgba(255,255,255,0),var(--anom1,#00eaff))}
html.nohud #hud{opacity:0}

/* Hint line */
#soundHint.visible{opacity:1}
#soundHint span{margin:0 1.1em}
#soundHint b{font-weight:400;font-style:normal;color:rgba(255,236,214,.95)}

/* Custom cursor */
#curDot,#curRing{
    position:fixed;
    left:0;
    top:0;
    z-index:200;
    pointer-events:none;
    opacity:0;
    transition:opacity .5s ease;
}
#curDot i,#curRing i{position:absolute;display:block;border-radius:50%}
#curDot i{
    left:-3px;top:-3px;width:6px;height:6px;
    background:#fff5e8;
    box-shadow:0 0 8px #fff,0 0 18px #ff9a3c,0 0 34px #ff6a00;
}
#curRing i{
    left:-17px;top:-17px;width:34px;height:34px;
    border:1px solid rgba(255,190,120,.4);
}
html.cur-on #curDot,html.cur-on #curRing{opacity:1}
html.idle #curDot,html.idle #curRing{opacity:0}

.ripple{
    position:absolute;
    width:40px;height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    border:1px solid rgba(255,200,140,.75);
    box-shadow:0 0 18px rgba(255,120,20,.45),inset 0 0 12px rgba(255,120,20,.25);
    pointer-events:none;
    animation:ripple .95s cubic-bezier(.16,.8,.2,1) forwards;
}
@keyframes ripple{
    0%{transform:scale(.2);opacity:.9}
    100%{transform:scale(5.5);opacity:0}
}

/* Automatic quality fallback */
html.lowfx #grain,html.lowfx #distortion,html.lowfx #swirl2{display:none}
html.lowfx #rune.show{animation-name:runeShowLite}
@keyframes runeShowLite{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.62) rotate(-12deg)}
    12%,70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 12px rgba(255,150,50,.95))}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.14) rotate(8deg);filter:none}
}

/* Reduced motion: keep the atmosphere, drop flashes, drift and glitches */
@media (prefers-reduced-motion:reduce){
    .ring,.orbit,#glyphs,#rays,#swirl,#swirl2,#grain,#coreGlow,#portalOpen{animation:none!important}
    #flash,#pulse,#eventShock{display:none}
    #anomalyCanvas.glitch{animation:none}
    .hud-name.swap{animation:none}
}

@media(max-width:700px){
    .hud-name{letter-spacing:.06em}
    #soundHint span{display:block;margin:0}
    #soundHint{white-space:normal;width:86vw;text-align:center}
}

/* ── Sound: plays your MP3 if it exists, otherwise a generated ambient bed.

const Sound=(()=>{

            ctx=new AC();

        get muted(){return muted},
        get ready(){return !!ctx&&started},
        get info(){return {ctx:!!ctx,state:ctx?ctx.state:null,drone:!!drone,started,muted}},
        start(){

            if(ctx.state==="suspended")ctx.resume().catch(()=>{});
            if(!started){started=true;master.gain.setTargetAtTime(muted?0:.9,ctx.currentTime,.8);}
        },
        suspend(){if(ctx&&ctx.state==="running")ctx.suspend().catch(()=>{});},
        resume(){if(ctx&&started&&ctx.state==="suspended")ctx.resume().catch(()=>{});},
        toggle(){
            muted=!muted;
            music.muted=muted;
            if(ctx)master.gain.setTargetAtTime(muted?0:.9,ctx.currentTime,.15);

        },
        startDrone(){
            if(!ctx||drone)return;
            const t=ctx.currentTime;
            const g=ctx.createGain();g.gain.value=0;g.connect(master);
            const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=360;lp.Q.value=.8;lp.connect(g);

            [[440,.5],[523.25,.4],[659.25,.35],[880,.15]].forEach(([f,v],i)=>{
                const o=ctx.createOscillator(),vg=ctx.createGain(),tr=ctx.createOscillator(),tg=ctx.createGain();
                o.type="sine";o.frequency.value=f*(1+(i-1.5)*.0007);vg.gain.value=v*.05;
                tr.frequency.value=.09+i*.037;tg.gain.value=v*.04;
                tr.connect(tg);tg.connect(vg.gain);
                o.connect(vg);vg.connect(pad);o.start(t);tr.start(t);nodes.push(o,tr);

            g.gain.linearRampToValueAtTime(.42,t+5);
            drone={g,pad,nodes};
        },
        chime(i){
            if(!ctx||!started||muted||ctx.state!=="running")return;
            const t=ctx.currentTime;
            const f=hz(scale[melody[i%melody.length]]+(i%3===0?12:0));

            g.gain.exponentialRampToValueAtTime(.0001,t+2.4);

        },
        whoosh(k=1){
            if(!ctx||!started||muted||ctx.state!=="running")return;
            const t=ctx.currentTime;
            const src=ctx.createBufferSource();src.buffer=noise();
            const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.4;
            bp.frequency.setValueAtTime(180,t);
            bp.frequency.exponentialRampToValueAtTime(2600,t+.75);
            bp.frequency.exponentialRampToValueAtTime(400,t+1.5);
            const g=ctx.createGain();
            g.gain.setValueAtTime(.0001,t);
            g.gain.exponentialRampToValueAtTime(.09*k,t+.6);
            g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
            src.connect(bp);bp.connect(g);g.connect(fx);
            src.start(t);src.stop(t+1.7);
        },
        sting(type){
            if(!ctx||!started||muted||ctx.state!=="running")return;
            const t=ctx.currentTime;
            const tone=(kind,f0,f1,dur,gain,when=0,dest=fx,lp=0,atk=.05)=>{
                const o=ctx.createOscillator(),g=ctx.createGain();
                o.type=kind;
                o.frequency.setValueAtTime(f0,t+when);
                if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+when+dur);
                g.gain.setValueAtTime(.0001,t+when);
                g.gain.exponentialRampToValueAtTime(gain,t+when+Math.min(atk,dur*.4));
                g.gain.exponentialRampToValueAtTime(.0001,t+when+dur);
                o.connect(g);
                if(lp){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=lp;g.connect(f);f.connect(dest);}
                else g.connect(dest);
                o.start(t+when);o.stop(t+when+dur+.05);
            };
            switch(type){
                case 7:  // abduction: rising hum
                    tone("sine",110,880,2.4,.10,0,fx,0,1.2);tone("sine",113,900,2.4,.06,.03,fx,0,1.2);break;
                case 8:  // invasion: laser zaps
                    for(let k=0;k<5;k++)tone("sawtooth",2200,240,.16,.045,k*.28+Math.random()*.08,fx,3200);break;
                case 9:  // tripod horn
                    tone("sawtooth",70,46,1.9,.12,0,master,320,.2);tone("square",35,32,1.9,.07,0,master,180,.2);break;
                case 10: // meteor: whoosh then impact
                    this.whoosh(1.6);tone("sine",95,28,1.1,.4,1.55,master);break;
                case 11: // xenoflora: bubbling blips
                    for(let k=0;k<7;k++){const f=280+Math.random()*500;tone("sine",f,f*1.8,.18,.06,k*.22+Math.random()*.1);}break;
                case 12: // aurora: slow shimmering chord
                    [220,277.18,329.63,493.88].forEach((f,i)=>tone("sine",f,f*1.002,3.6,.05,i*.18,fx,0,1.4));break;
                case 13: // the watcher: heartbeat
                    [0,.28,.95,1.23].forEach((w,i)=>tone("sine",i%2?52:62,i%2?34:40,.32,.42,w,master));break;
            }
        },
        boom(){
            if(!ctx||!started||muted||ctx.state!=="running")return;
            const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
            o.type="sine";
            o.frequency.setValueAtTime(110,t);
            o.frequency.exponentialRampToValueAtTime(30,t+.9);
            g.gain.setValueAtTime(.0001,t);
            g.gain.exponentialRampToValueAtTime(.45,t+.02);
            g.gain.exponentialRampToValueAtTime(.0001,t+1.3);
            o.connect(g);g.connect(master);
            o.start(t);o.stop(t+1.4);
        }
    };
})();

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v));}
function smooth(v){v=clamp(v);return v*v*(3-2*v);}
function easeIn(v){v=clamp(v);return v*v*v;}
function easeOut(v){v=clamp(v);return 1-Math.pow(1-v,3);}
function easeInOut(v){v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;}
function hash(n){const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function safeType(v){return Number.isInteger(v)&&v>=0&&v<palettes.length?v:0;}
function pal(v){return palettes[safeType(v)];}
function sideCenter(side){return side==="L"?W*.235:W*.765;}
function sideBounds(side){return side==="L"?{l:W*.015,r:W*.425}:{l:W*.575,r:W*.985};}

function makeCity(side){
    const b=sideBounds(side);
    const buildings=[];
    const blocks=[];
    let x=b.l;
    let i=0;
    while(x<b.r){
        const gap=6+hash(i+91)*9;
        const w=32+hash(i*2.19+4)*54;
        const h=90+hash(i*3.71+9)*210;
        const sd=hash(i*7.31+side.charCodeAt(0));
        // Windows are laid out once (not every frame) so they no longer pop while a building shrinks.
        const wins=[];
        const rows=Math.max(3,Math.floor(h/24)),cols=Math.max(2,Math.floor(w/14));
        for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
            const sig=hash(Math.floor(sd*1000)+r*37+c*71);
            if(sig>.57){
                const wx=6+c*13,wy=9+r*18;
                if(wx<w-5&&wy<h-6)wins.push({x:wx,y:wy,k:(r+c)%3,sig});
            }
        }
        buildings.push({
            x,w,h,roof:i%5,seed:sd,wins,
            depth:.55+hash(i*2.77)*.45,twinkle:hash(i*4.12)
        });
        x+=w+gap;
        i++;
    }
    for(let j=0;j<10;j++){
        blocks.push({
            x:b.l+(j+.3)*((b.r-b.l)/10),
            h:45+hash(j*5.17+31)*80,
            skew:(hash(j*6.17+10)-.5)*.06,
            seed:hash(j*9.71+20)
        });
    }
    return {buildings,blocks};
}

}

const _rgbCache=new Map();
function rgba(hex,a){
    if(!hex||hex[0]!=="#")return hex;
    let c=_rgbCache.get(hex);
    if(!c){
        let h=hex.slice(1);
        if(h.length===3)h=h.split("").map(x=>x+x).join("");
        const n=parseInt(h,16);
        c=[n>>16,(n>>8)&255,n&255];
        _rgbCache.set(hex,c);
    }
    return `rgba(${c[0]},${c[1]},${c[2]},${+a.toFixed(3)})`;
}

function glow(x,y,r,color,a=.5){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,rgba(color,a));
    g.addColorStop(.22,rgba(color,a*.52));
    g.addColorStop(1,rgba(color,0));
    ctx.fillStyle=g;
    ctx.fillRect(x-r,y-r,r*2,r*2);
}

function drawCity(side,type,alpha,now){
    const data=city[side];
    if(!data||alpha<.002)return;
    const b=sideBounds(side),cx=sideCenter(side),p=progress(now),pa=pal(type);
    const horizon=H*.805;
    ctx.save();

    for(let bi=0;bi<data.buildings.length;bi++){
        const s=data.buildings[bi];
        const mid=s.x+s.w/2;
        const near=clamp(1-Math.abs(mid-cx)/(W*.24));
        let vanish=0,split=0,pull=0,shake=0,collapse=0,lift=0;

        if(type===0){
            vanish=smooth(clamp((p-.14)/.55))*near;
            split=vanish;
            shake=split*(2+Math.sin(now*.025+s.seed*20)*6);
        }else if(type===2){
            pull=smooth(clamp(1-Math.abs(mid-cx)/(W*.20)));
            const ep=smooth(clamp((p-.10)/.50));
            pull*=ep;
            vanish=pull*.72;
            shake=pull*4;
            lift=pull*25;
        }else if(type===3){
            lift=16+34*Math.sin(now*.002+s.seed*12);
        }else if(type===4){
            collapse=smooth(clamp((p-.10)/.58))*near;
            vanish=collapse*.94;
            lift=collapse*(25+20*Math.sin(s.seed*19));
        }else if(type===5){
            const imp=smooth(clamp(p/.48))*near;
            const blast=(1-imp)*near;
            shake=blast*18;
            lift=blast*(10+12*Math.sin(s.seed*17));
        }else if(type===6){
            const rip=smooth(clamp((p-.05)/.72));
            shake=rip*Math.sin(now*.018+s.seed*25)*10;
            vanish=rip*near*.48;
        }else if(type===9){
            // tripod footsteps rattle the skyline
            shake=Math.pow(Math.max(0,Math.sin(now*.0035)),12)*(1.5+3.5*near);
        }else if(type===10){
            // the big meteor lands at p≈.6
            const im=Math.max(0,1-Math.abs(p-.6)/.1);
            shake=im*(4+near*10)*Math.sin(now*.05+s.seed*9);
            lift=im*near*8;
        }

        const bx=s.x+shake+(side==="L"?1:-1)*pull*34*Math.sin(s.seed*6);
        const by=horizon-s.h-lift;
        let bh=s.h*(1-.19*vanish);
        let a=alpha*(.86-.68*vanish);
        if(a<.008)continue;

        ctx.save();
        ctx.translate(bx,by);
        ctx.rotate((type===0?split*.03*Math.sin(s.seed*30):0)+(type===5?shake*.002:0));
        ctx.globalAlpha=a;

        const body=ctx.createLinearGradient(0,0,0,bh);
        body.addColorStop(0,"rgba(20,29,42,.92)");
        body.addColorStop(.45,"rgba(8,13,22,.95)");
        body.addColorStop(1,"rgba(2,5,10,.99)");
        ctx.fillStyle=body;
        ctx.beginPath();
        ctx.moveTo(0,3);
        if(s.roof===1){ctx.lineTo(s.w*.5,-18);ctx.lineTo(s.w,3)}
        else if(s.roof===2){ctx.lineTo(s.w*.78,-11);ctx.lineTo(s.w,-1)}
        else{ctx.lineTo(0,-1);ctx.lineTo(s.w,-1)}
        ctx.lineTo(s.w,bh);ctx.lineTo(0,bh);ctx.closePath();ctx.fill();

        ctx.strokeStyle=rgba(pa.b,.32);
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(2,1);ctx.lineTo(2,bh);ctx.moveTo(s.w-2,1);ctx.lineTo(s.w-2,bh);
        ctx.stroke();

        for(let wi=0;wi<s.wins.length;wi++){
            const wd=s.wins[wi];
            if(wd.y>=bh-6)continue;
            const col=wd.k===0?pa.a:wd.k===1?pa.b:pa.c;
            ctx.fillStyle=rgba(col,.14+.08*Math.sin(now*.003+wd.sig*8)**2);
            ctx.fillRect(wd.x,wd.y,4,6);
        }

        // Neon contour and fracture cuts.
        ctx.strokeStyle=rgba(pa.a,type===6?.25:.10+vanish*.35);
        ctx.lineWidth=type===6?1.8:1;
        ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(s.w*.5,s.roof===1?-18:-1);ctx.lineTo(s.w,3);ctx.stroke();

        if(type===0&&split>.06){
            for(let k=0;k<5;k++){
                const yy=bh*(.12+k*.17);
                const dx=(k%2?-1:1)*split*(10+hash(k+s.seed*91)*26);
                ctx.strokeStyle=rgba(k%2?pa.a:pa.c,.55*split);
                ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(s.w*.45+dx,yy-5);ctx.lineTo(s.w,yy+3);ctx.stroke();
            }
        }

        if(type===4&&collapse>.02){
            ctx.globalCompositeOperation="screen";
            for(let k=0;k<9;k++){
                const xx=hash(k+s.seed*31)*s.w;
                const yy=hash(k+s.seed*57)*bh;
                ctx.fillStyle=rgba(k%2?pa.a:pa.c,.08+.25*collapse);
                ctx.fillRect(xx-collapse*xx,yy,3+collapse*6,2+collapse*3);
            }
        }

        ctx.restore();

        if(type===4&&collapse>.04){
            for(let q=0;q<10;q++){
                const ang=(q/10)*TAU+s.seed*2;
                const rr=(20+hash(q+s.seed*99)*80)*(1-collapse*.8);
                const sx=bx+s.w*.5,sy=by+bh*.45;
                const ex=cx,ey=H*.56;
                const px=sx+(ex-sx)*collapse*.82+Math.cos(ang)*rr;
                const py=sy+(ey-sy)*collapse*.82+Math.sin(ang)*rr*.35;
                ctx.fillStyle=rgba(q%2?pa.a:pa.c,alpha*.32*(1-collapse*.5));
                ctx.fillRect(px,py,2.2+collapse*2,2.2);
            }
        }
    }

    // Distant towers give the side scene more depth.
    for(let i=0;i<data.blocks.length;i++){
        const t=data.blocks[i];
        const h=t.h;
        const x=t.x;
        const y=horizon-h;
        ctx.save();
        ctx.globalAlpha=alpha*.20;
        ctx.translate(x,y);
        ctx.rotate(t.skew);
        ctx.fillStyle="rgba(5,9,16,.98)";
        ctx.fillRect(-9,-3,18,h+5);
        ctx.strokeStyle=rgba(pa.c,.18);
        ctx.strokeRect(-9,-3,18,h+5);
        ctx.restore();
    }

    drawHorizon(side, p, pa, now);
    ctx.restore();
}

function drawBlackHole(side,alpha,type,now){

        ctx.globalAlpha=alpha*life*(.025+.20*Math.abs(Math.sin(i*1.29+now*.004)));

    }

    ctx.restore();
}

/* ── ambient sky: shooting stars + tiny far-away ships (always on) ── */
const shooters=[];

const tinyShips=[{y:.085,s:.000018,ph:.1,sz:.2},{y:.16,s:-.000012,ph:.6,sz:.15}];
function drawAmbientSky(now){
    if(REDUCED)return;
    ctx.save();
    ctx.globalCompositeOperation="screen";
    if(now>nextShoot){
        nextShoot=now+2600+Math.random()*5200;
        const dir=Math.random()<.5?1:-1;
        shooters.push({x:W*(.1+Math.random()*.8),y:H*(.04+Math.random()*.2),vx:dir*(.5+Math.random()*.5),vy:.2+Math.random()*.25,t0:now,life:900});
    }
    for(let i=shooters.length-1;i>=0;i--){
        const st=shooters[i],age=now-st.t0;
        if(age>st.life){shooters.splice(i,1);continue;}
        const k=age/st.life,hx=st.x+st.vx*age,hy=st.y+st.vy*age,tl=90;
        const g=ctx.createLinearGradient(hx,hy,hx-st.vx*tl,hy-st.vy*tl);
        g.addColorStop(0,"rgba(255,245,230,.9)");g.addColorStop(1,"rgba(255,180,90,0)");

        ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-st.vx*tl,hy-st.vy*tl);ctx.stroke();
    }
    ctx.restore();
    for(const u of tinyShips){
        const x=(((u.ph+now*u.s)%1)+1)%1*W*1.2-W*.1;
        drawUFO(x,H*u.y+Math.sin(now*.001+u.ph*9)*4,u.sz,.3,pal(leftType),now,0);

}

    glow(ex,ey,Ht*.17,pa.a,alpha*(.55+.4*fire));
    ctx.fillStyle=pa.hot;ctx.globalAlpha=alpha;

/* ── 11 · Xenoflora bloom ── */
function drawFlora(side,alpha,type,now){
    if(type!==11)return;
    const b=sideBounds(side),pa=pal(type),p=progress(now),gy=H*.815;
    const fade=1-smooth(clamp((p-.80)/.2));
    ctx.save();
    ctx.globalCompositeOperation="screen";ctx.lineCap="round";
    for(let i=0;i<16;i++){
        const bx=b.l+(i+.5)/16*(b.r-b.l)+(hash(i*4.4)-.5)*30;
        const grow=smooth(clamp((p-.03-hash(i*2.2)*.28)/.34))*fade;
        if(grow<=.005)continue;
        const h=(70+hash(i*3.9)*230)*grow;
        const sw1=Math.sin(now*.0013+i*1.7)*(14+h*.07),sw2=Math.sin(now*.0011+i*2.3+1)*(24+h*.1);
        const tipx=bx+sw2*1.1,tipy=gy-h,c1x=bx+sw1,c1y=gy-h*.35,c2x=bx-sw2*.6,c2y=gy-h*.7;
        const col=i%3===0?pa.c:(i%3===1?pa.a:pa.b);
        ctx.strokeStyle=col;
        ctx.beginPath();ctx.moveTo(bx,gy);ctx.bezierCurveTo(c1x,c1y,c2x,c2y,tipx,tipy);
        ctx.globalAlpha=alpha*.16;ctx.lineWidth=9;ctx.stroke();
        ctx.globalAlpha=alpha*.85;ctx.lineWidth=2;ctx.stroke();
        for(let k=1;k<=3;k++){
            const t=k*.24,u=1-t;
            const px=u*u*u*bx+3*u*u*t*c1x+3*u*t*t*c2x+t*t*t*tipx;
            const py=u*u*u*gy+3*u*u*t*c1y+3*u*t*t*c2y+t*t*t*tipy;
            ctx.globalAlpha=alpha*.55*grow;ctx.fillStyle=pa.b;
            ctx.beginPath();ctx.ellipse(px+(k%2?6:-6),py,4.5,2.4,k%2?.6:-.6,0,TAU);ctx.fill();
        }
        const pulse=.7+.3*Math.sin(now*.004+i);
        glow(tipx,tipy,28+10*pulse,col,alpha*.55*grow);
        ctx.globalAlpha=alpha*grow;ctx.fillStyle=pa.hot;
        ctx.beginPath();ctx.arc(tipx,tipy,2.6+pulse,0,TAU);ctx.fill();
        ctx.globalAlpha=alpha*.2*grow;ctx.fillStyle=col;
        ctx.beginPath();ctx.ellipse(bx,gy+3,26,5,0,0,TAU);ctx.fill();
    }
    const S=Math.round(50*(lowfx?.5:1));
    for(let i=0;i<S;i++){
        const t=(now*.00012*(.5+hash(i*1.3))+hash(i*8.8))%1;
        ctx.globalAlpha=alpha*fade*smooth(p/.2)*.6*Math.sin(Math.PI*t);
        ctx.fillStyle=i%2?pa.c:pa.a;
        ctx.fillRect(b.l+hash(i*6.6)*(b.r-b.l)+Math.sin(now*.001+i)*14,gy-t*H*.5,2,2);
    }
    ctx.restore();
}

/* ── 12 · Aurora storm (behind the skyline) ── */
function drawAurora(side,alpha,type,now){
    if(type!==12)return;
    const b=sideBounds(side),pa=pal(type),p=progress(now);
    const life=smooth(clamp(p/.2))*(1-smooth(clamp((p-.82)/.18)));
    if(life<.01)return;
    ctx.save();
    ctx.globalCompositeOperation="screen";
    const cols=[pa.a,pa.b,pa.c,pa.a];
    for(let k=0;k<4;k++){
        const base=H*(.17+k*.06),hgt=H*(.24+k*.03),step=16;
        const top=[],bot=[];
        for(let x=b.l-20;x<=b.r+20;x+=step){
            const w=Math.sin(x*.009+now*.0007*(1+k*.25)+k*1.7)*24+Math.sin(x*.0043-now*.0004+k)*18;
            bot.push([x,base+w]);
            top.push([x,base+w-hgt*(.65+.35*Math.sin(x*.006+now*.0006+k*2))]);
        }
        const gr=ctx.createLinearGradient(0,base-hgt,0,base+30);
        gr.addColorStop(0,rgba(cols[k],0));gr.addColorStop(.65,rgba(cols[k],.32));
        gr.addColorStop(.9,rgba(cols[(k+1)%4],.7));gr.addColorStop(1,rgba(cols[k],0));
        ctx.fillStyle=gr;
        for(let i=0;i<bot.length-1;i++){
            const xm=(bot[i][0]+bot[i+1][0])/2;
            const e=smooth(clamp(Math.min(xm-(b.l-20),(b.r+20)-xm)/140));
            if(e<.01)continue;
            ctx.globalAlpha=alpha*life*(.85-k*.08)*e;
            ctx.beginPath();
            ctx.moveTo(top[i][0],top[i][1]);ctx.lineTo(top[i+1][0]+1,top[i+1][1]);
            ctx.lineTo(bot[i+1][0]+1,bot[i+1][1]);ctx.lineTo(bot[i][0],bot[i][1]);
            ctx.closePath();ctx.fill();
        }
        ctx.lineWidth=1.2;ctx.strokeStyle=cols[k];
        for(let i=0;i<bot.length;i+=2){
            const e=smooth(clamp(Math.min(bot[i][0]-(b.l-20),(b.r+20)-bot[i][0])/140));
            ctx.globalAlpha=alpha*life*.28*e*(.35+.65*Math.abs(Math.sin(i*1.7+now*.0018+k)));
            ctx.beginPath();ctx.moveTo(bot[i][0],bot[i][1]);
            ctx.lineTo(top[i][0],top[i][1]+(bot[i][1]-top[i][1])*.25);ctx.stroke();
        }
    }
    ctx.restore();
}

/* ── 13 · The Watcher: a colossal eye that follows your cursor ── */
function drawWatcher(side,alpha,type,now){
    if(type!==13)return;
    const cx=sideCenter(side),cy=H*.235,pa=pal(type),p=progress(now);
    const open=smooth(clamp((p-.03)/.2))*(1-smooth(clamp((p-.82)/.18)));
    if(open<.01)return;
    const bt=(now+side.charCodeAt(0)*310)%3800,blink=bt<170?Math.abs(bt-85)/85:1;
    const hw=Math.min(W*.115,240),hh=hw*.46*open*blink;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalCompositeOperation="screen";
    glow(0,0,hw*2,pa.a,alpha*.18*open);
    ctx.globalCompositeOperation="source-over";
    const almond=()=>{ctx.beginPath();ctx.moveTo(-hw,0);ctx.quadraticCurveTo(0,-hh*2,hw,0);ctx.quadraticCurveTo(0,hh*1.8,-hw,0);ctx.closePath();};
    ctx.globalAlpha=alpha;
    almond();
    ctx.save();ctx.clip();
    const sc=ctx.createRadialGradient(0,0,0,0,0,hw);
    sc.addColorStop(0,rgba(pa.hot,.95));sc.addColorStop(.6,rgba(pa.hot,.55));sc.addColorStop(1,rgba(pa.b,.7));
    ctx.fillStyle=sc;ctx.fillRect(-hw,-hh*2,hw*2,hh*4);
    ctx.strokeStyle=rgba(pa.b,.35);ctx.lineWidth=1;
    for(let i=0;i<14;i++){
        const a=i/14*TAU;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*hw*.95,Math.sin(a)*hh*.95);
        ctx.quadraticCurveTo(Math.cos(a)*hw*.6+(hash(i)-.5)*20,Math.sin(a)*hh*.5,Math.cos(a)*hw*.3,Math.sin(a)*hh*.2);ctx.stroke();
    }
    const ox=mx*hw*.30+Math.sin(now*.0008)*hw*.05,oy=my*hh*.35,ir=Math.min(hh*.92,hw*.36);
    const ig=ctx.createRadialGradient(ox,oy,ir*.2,ox,oy,ir);
    ig.addColorStop(0,rgba(pa.a,1));ig.addColorStop(.6,rgba(pa.b,.95));ig.addColorStop(1,rgba(pa.c,.9));
    ctx.fillStyle=ig;ctx.beginPath();ctx.arc(ox,oy,ir,0,TAU);ctx.fill();
    ctx.strokeStyle=rgba(pa.hot,.32);ctx.lineWidth=1;
    for(let i=0;i<40;i++){
        const a=i/40*TAU;
        ctx.beginPath();ctx.moveTo(ox+Math.cos(a)*ir*.25,oy+Math.sin(a)*ir*.25);ctx.lineTo(ox+Math.cos(a)*ir*.97,oy+Math.sin(a)*ir*.97);ctx.stroke();
    }
    ctx.fillStyle="#000";
    ctx.beginPath();ctx.ellipse(ox,oy,ir*(.13+.05*Math.sin(now*.002)),ir*.9,0,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.beginPath();ctx.ellipse(ox-ir*.3,oy-ir*.35,ir*.12,ir*.07,-.5,0,TAU);ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation="screen";
    almond();
    ctx.strokeStyle=pa.c;ctx.lineWidth=8;ctx.globalAlpha=alpha*.3;ctx.stroke();
    ctx.strokeStyle=pa.hot;ctx.lineWidth=2.4;ctx.globalAlpha=alpha*.95;ctx.stroke();
    if(open>.3){
        ctx.lineWidth=1.2;
        for(let i=0;i<28;i++){
            const a=i/28*TAU,ex=Math.cos(a)*hw*1.03,ey=Math.sin(a)*hh*1.0;
            const len=14+18*hash(i)+8*Math.sin(now*.004+i);
            ctx.strokeStyle=i%2?pa.a:pa.c;ctx.globalAlpha=alpha*open*(.12+.16*hash(i*3));
            ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*len,ey+Math.sin(a)*len*.8);ctx.stroke();
        }
    }
    ctx.restore();
}

function drawSide(side,type,alpha,now){
    if(alpha<=.001)return;
    const safe=safeType(type),pa=pal(safe);
    drawRoad(side,alpha,safe,now);
    drawAurora(side,alpha,safe,now);
    drawWatcher(side,alpha,safe,now);
    drawTripods(side,alpha,safe,now);
    drawCity(side,safe,alpha,now);
    drawPeople(side,alpha,safe,now);
    drawCars(side,alpha,safe,now);
    drawTeleportPads(side,alpha,safe,now);
    drawBlackHole(side,alpha,safe,now);
    drawFracture(side,alpha,safe,now);
    drawCollapse(side,alpha,safe,now);
    drawLevitation(side,alpha,safe,now);
    drawImpact(side,alpha,safe,now);
    drawChromatic(side,alpha,safe,now);
    drawFlora(side,alpha,safe,now);
    drawAbduction(side,alpha,safe,now);
    drawFleet(side,alpha,safe,now);
    drawMeteors(side,alpha,safe,now);
    drawEventNodes(side,alpha,safe,now);
}

function transitionTear(side,alpha,now){
    if(alpha<=.002)return;
    const cx=sideCenter(side),cy=H*.50,p=progress(now),pa=pal(side==="L"?leftType:rightType);
    const t=smooth(clamp(p/(TRANSITION/currentCycleLength())));
    const w=(55+155*Math.sin(Math.PI*t))*alpha;
    ctx.save();ctx.globalCompositeOperation="screen";
    const g=ctx.createLinearGradient(cx-w,0,cx+w,0);
    g.addColorStop(0,rgba(pa.a,0));g.addColorStop(.44,rgba(pa.a,.04));g.addColorStop(.5,rgba(pa.c,.38));g.addColorStop(.56,rgba(pa.a,.04));g.addColorStop(1,rgba(pa.a,0));
    ctx.fillStyle=g;ctx.fillRect(cx-w,H*.10,w*2,H*.70);
    for(let i=0;i<10;i++){
        const y=H*.16+i*45+Math.sin(now*.005+i)*5;
        ctx.strokeStyle=i%2?pa.a:pa.c;ctx.globalAlpha=alpha*(.04+.03*(i%3));ctx.lineWidth=i%4===0?2:1;
        ctx.beginPath();ctx.moveTo(cx-w*.8,y);ctx.lineTo(cx+w*.8,y+Math.sin(i+now*.003)*8);ctx.stroke();
    }
    ctx.restore();
}

function nextCycle(now){
    cycleNo++;
    oldLeft=safeType(leftType);oldRight=safeType(rightType);
    if(forcedPair){
        leftType=forcedPair[0];rightType=forcedPair[1];forcedPair=null;
    }else if(testMode){
        leftType=testIndex%14;
        rightType=(testIndex+7)%14;
        testIndex=(testIndex+1)%14;
    }else{
        leftType=sequenceLeft[cycleNo%sequenceLeft.length];
        rightType=sequenceRight[cycleNo%sequenceRight.length];
    }
    cycleStart=now;
    state.cycles=cycleNo+1;
    state.lastTypes=`${leftType}|${rightType}`;
    document.documentElement.dataset.lastAnomaly=`${typeNames[leftType]} / ${typeNames[rightType]}`;
    applyReaction(.95);
    afterCycle();
}

const displayNames=["Reality fracture","Teleportation","Gravitational void","Levitation event","Matter collapse","Dimensional impact","Chromatic rift","Alien abduction","Invasion fleet","Tripod walkers","Meteor storm","Xenoflora bloom","Aurora storm","The Watcher"];
const nameL=document.getElementById("nameL"),nameR=document.getElementById("nameR");
const barL=document.getElementById("barL"),barR=document.getElementById("barR");

const glyphL=document.getElementById("glyphL"),glyphR=document.getElementById("glyphR");
function alienText(t){
    let out="";
    for(let k=0;k<9;k++)out+=glyphSet[Math.floor(hash(t*17.3+k*3.1)*glyphSet.length)];
    return out;
}
function setHudNames(){
    [[nameL,glyphL,leftType],[nameR,glyphR,rightType]].forEach(([el,gl,t])=>{
        const txt=displayNames[safeType(t)];
        if(el.textContent===txt)return;
        el.textContent=txt;
        gl.textContent=alienText(safeType(t));
        el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap");
    });
    scene.style.setProperty("--nebL",pal(leftType).a);
    scene.style.setProperty("--nebR",pal(rightType).a);
}

function triggerGlitch(){
    if(REDUCED)return;
    canvas.classList.remove("glitch");void canvas.offsetWidth;canvas.classList.add("glitch");
}

function afterCycle(){
    setHudNames();
    triggerGlitch();
    Sound.whoosh(1);
    if(leftType===5||rightType===5)Sound.boom();
    new Set([leftType,rightType]).forEach(t=>{if(t>=7)Sound.sting(t);});
}

let lastSkip=0;
const pickMap={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8,"0":9,"q":10,"w":11,"e":12,"r":13};
function skipCycle(){
    const n=performance.now();
    if(n-lastSkip<650)return;
    lastSkip=n;
    cycleStart=n-currentCycleLength()-1;
}

// Energy tethers: the portal feeds both anomalies; they surge at the start of every cycle.
function drawTethers(now){
    if(REDUCED)return;
    const p=progress(now);
    const surge=Math.pow(clamp(1-p/.26),2);
    const hot=surge>.03;
    const seedT=Math.floor(now/(hot?60:220));
    ctx.save();
    ctx.globalCompositeOperation="screen";
    ctx.lineCap="round";ctx.lineJoin="round";
    for(const side of ["L","R"]){
        const pa=pal(side==="L"?leftType:rightType);
        const sx=W*.5,sy=H*.5,ex=sideCenter(side),dir=side==="L"?0:41;
        const bolts=hot?3:1;
        for(let b=0;b<bolts;b++){
            ctx.beginPath();
            const n=16;
            for(let i=0;i<=n;i++){
                const t=i/n,env=Math.sin(Math.PI*t);
                let y;
                if(hot){
                    const j=(hash(seedT*17.13+i*5.71+b*31.7+dir)-.5)*2;
                    y=sy+(b-1)*H*.07*env+j*env*(18+surge*30);
                }else{
                    y=sy+env*(Math.sin(now*.0007+i*.8+dir)*7+Math.sin(now*.0013+i*1.7)*3);
                }
                const x=sx+(ex-sx)*t;
                i?ctx.lineTo(x,y):ctx.moveTo(x,y);
            }
            const a=hot?.10+.55*surge:.09;
            ctx.strokeStyle=pa.a;ctx.lineWidth=hot?5:3;ctx.globalAlpha=a*.28;ctx.stroke();
            ctx.strokeStyle=pa.hot;ctx.lineWidth=hot?1.5:1;ctx.globalAlpha=a*(hot?.9:.6);ctx.stroke();
        }
    }
    ctx.restore();
}

// Watches frame time; on a struggling device it drops to a lighter look instead of stuttering.
const NOLOW=new URLSearchParams(location.search).has("nolowfx");
let gAcc=0,gN=0,gBad=0,gSlow=0,gLast=performance.now(),lowfx=false;
function governor(now){
    const dt=now-gLast;gLast=now;
    if(NOLOW||lowfx||document.hidden){gSlow=0;return;}
    // A single long frame is a hitch (tab switch, GC); several in a row means the device is struggling.
    if(dt>200){gSlow++;if(gSlow<3)return;}else gSlow=0;
    gAcc+=Math.min(dt,400);gN++;
    // Judge after 45 frames, or after ~3 s of frame time on very slow devices.
    if(gN<45&&!(gAcc>=3000&&gN>=6))return;
    const avg=gAcc/gN;gAcc=0;gN=0;
    gBad=avg>27?gBad+1:0;
    if(gBad>=2){
        lowfx=true;
        root.classList.add("lowfx");
        if(maxDPR>1){maxDPR=1;resize();}
    }
}

function render(now){
    const len=currentCycleLength();
    if(now-cycleStart>=len)nextCycle(now);

    ctx.clearRect(0,0,W,H);
    drawAtmosphere(now);

    const p=progress(now);
    barL.style.transform=`scaleX(${p.toFixed(3)})`;
    barR.style.transform=`scaleX(${p.toFixed(3)})`;
    let inA=1,outA=0;
    if(p<TRANSITION/len){
        inA=smooth(p/(TRANSITION/len));
        outA=1-inA;
    }else if(p>1-TRANSITION/len){
        outA=smooth((p-(1-TRANSITION/len))/(TRANSITION/len));
        inA=1-outA;
    }

    // Fade old events out while the next dimensional event grows in.
    drawSide("L",oldLeft,outA*.78,now);
    drawSide("R",oldRight,outA*.78,now);
    drawSide("L",leftType,inA*1.0,now);
    drawSide("R",rightType,inA*1.0,now);
    transitionTear("L",inA,now);
    transitionTear("R",inA,now);
    drawTethers(now);

    state.frames++;
}

function tick(){
    const now=performance.now();
    try{
        render(now);
        governor(now);
    }catch(err){
        state.errors.push(String(err?.stack||err));
        if(state.errors.length>20)state.errors.shift();
        document.documentElement.dataset.runtimeErrors=String(state.errors.length);
        leftType=safeType(leftType);rightType=safeType(rightType);oldLeft=safeType(oldLeft);oldRight=safeType(oldRight);
        cycleStart=now;
    }
    raf=requestAnimationFrame(tick);
}

// Start with different left/right events so the sides are visibly active from frame one.
leftType=0;rightType=3;oldLeft=6;oldRight=2;cycleStart=performance.now()-Math.max(120,TRANSITION*.55);
applyReaction(.78);
setHudNames();
requestAnimationFrame(tick);

// ── Audio wake-up ──
// Browsers only allow sound after a real gesture, and touch devices count pointerup/touchend
// (not pointerdown), so every gesture retries until audio is actually running.
const hintEl=document.getElementById("soundHint");
const COARSE=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
let awake=false,hintTimer=0,fileState=0; // fileState: 0 untried · 1 playing · 2 unavailable

function setHint(html,ms){
    hintEl.innerHTML=html;
    hintEl.classList.add("visible");
    clearTimeout(hintTimer);
    if(ms)hintTimer=setTimeout(()=>hintEl.classList.remove("visible"),ms);
}
function controlsHint(){
    return COARSE
        ? "Tap to summon the next anomaly"
        : "<span><b>Space</b> next anomaly</span> <span><b>1–9</b> pick anomaly</span> <span><b>M</b> sound</span> <span><b>H</b> names</span> <span><b>F</b> fullscreen</span>";
}
setTimeout(()=>{if(!awake)setHint(COARSE?"Tap to turn on sound":"Click anywhere to turn on sound",0);},1400);

music.addEventListener("error",()=>{fileState=2;Sound.startDrone();});

function tryFile(){
    if(fileState!==0)return;
    fileState=3; // attempt in flight
    if(!music.getAttribute("src")){
        music.src="dave-deville-investigate-loopable.mp3";
        music.loop=true;
        music.volume=.34;
    }
    music.play().then(()=>{fileState=1;state.audio=true;}).catch(err=>{
        if(err&&err.name==="NotAllowedError"){fileState=0;}   // no gesture yet: retry on the next one
        else{fileState=2;state.audio=false;Sound.startDrone();} // file missing or unsupported: generated bed
    });
}

function tryAudio(){
    Sound.start();
    tryFile();
    if(!awake){
        awake=true;
        setHint(controlsHint(),7000);
    }
}
window.enableAudio=tryAudio; // kept for backward compatibility

window.addEventListener("pointerdown",e=>{
    const first=!awake;
    tryAudio();
    pressed=true;
    spawnRipple(e.clientX,e.clientY);
    if(!first)skipCycle();
    poke();
},{passive:true});
window.addEventListener("pointerup",tryAudio,{passive:true});
window.addEventListener("click",tryAudio,{passive:true});

function toggleFullscreen(){
    if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();}
    else if(root.requestFullscreen){root.requestFullscreen().catch(()=>{});}
}

window.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key.toLowerCase(),first=!awake;
    tryAudio();
    if(k===" "||k==="enter"||k==="arrowright"){
        e.preventDefault();
        if(!e.repeat)skipCycle();
    }else if(e.repeat){
        return;
    }else if(k==="m"){
        if(!first)setHint(Sound.toggle()?"Sound off":"Sound on",1600);
    }else if(k in pickMap){
        forcedPair=[pickMap[k],pickMap[k]];
        lastSkip=0;skipCycle();
    }else if(k==="h"){
        root.classList.toggle("nohud");
    }else if(k==="f"){
        toggleFullscreen();
    }else if(k==="?"||k==="/"){
        setHint(controlsHint(),6000);
    }
    poke();
});

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
        Sound.suspend();
        if(fileState===1)music.pause();
    }else{
        Sound.resume();
        if(fileState===1&&!Sound.muted)music.play().catch(()=>{});
    }
});

setInterval(()=>{
    document.documentElement.dataset.anomalyFrames=String(state.frames);
    document.documentElement.dataset.anomalyCycles=String(state.cycles);
    document.documentElement.dataset.runtimeErrors=String(state.errors.length);
},1000);

</script>
