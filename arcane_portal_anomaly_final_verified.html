<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARCANE PORTAL — Dimensional Anomaly Wallpaper</title>

<style>
:root{
    --coreOrange:#ff720d;
    --coreGold:#ffc27c;
    --anomCyan:#00eaff;
    --anomBlue:#458cff;
    --anomViolet:#8b5cff;
    --anomMagenta:#ff35d5;
}

*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
}

body{
    position:relative;
    cursor:none;
    user-select:none;
}

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,104,10,.055) 0%,transparent 24%),
        radial-gradient(circle at 50% 50%,rgba(255,140,40,.024) 0%,transparent 46%),
        #000;
}

#camera{
    position:absolute;
    inset:-2%;
    transform-origin:center;
    will-change:transform;
}

#anomalyCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:4;
    pointer-events:none;
}

#stars,#particles,#rays,#glyphs,#sparks{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#stars{z-index:1}
#rays{z-index:2}
#glyphs{z-index:3}
#particles{z-index:5}
#sparks{z-index:14}

.star{
    position:absolute;
    width:1px;
    height:1px;
    border-radius:50%;
    background:rgba(255,223,195,.72);
    box-shadow:0 0 6px rgba(255,130,30,.36);
    animation:twinkle var(--d) ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.025;transform:scale(.3)}
    50%{opacity:var(--o);transform:scale(1.8)}
}

.ray{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:46vh;
    transform-origin:50% 100%;
    background:linear-gradient(to top,rgba(255,145,35,0),rgba(255,194,112,.02),rgba(255,235,205,.12),rgba(255,100,0,0));
    filter:blur(1px);
    opacity:.12;
}

#portal{
    position:absolute;
    left:50%;
    top:50%;
    width:min(68vmin,800px);
    height:min(68vmin,800px);
    transform:translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,165,80,.08);
}

.r1{
    width:100%;
    height:100%;
    border-color:rgba(255,125,20,.07);
    box-shadow:0 0 24px rgba(255,100,0,.025),inset 0 0 24px rgba(255,100,0,.022);
    animation:spin1 52s linear infinite;
}

.r2{
    width:92%;
    height:92%;
    border-style:dashed;
    border-color:rgba(255,215,175,.055);
    animation:spin2 36s linear infinite reverse;
}

.r3{
    width:79%;
    height:79%;
    border-color:rgba(255,140,35,.12);
    box-shadow:0 0 38px rgba(255,100,0,.05),inset 0 0 30px rgba(255,105,0,.036);
    animation:spin1 26s linear infinite;
}

.r4{
    width:66%;
    height:66%;
    border-style:dotted;
    border-color:rgba(255,220,190,.085);
    animation:spin2 18s linear infinite reverse;
}

.r5{
    width:53%;
    height:53%;
    border-color:rgba(255,118,15,.13);
    animation:spin1 13s linear infinite;
}

@keyframes spin1{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes spin2{
    from{transform:translate(-50%,-50%) rotate(360deg)}
    to{transform:translate(-50%,-50%) rotate(0)}
}

#ticks{
    position:absolute;
    left:50%;
    top:50%;
    width:97%;
    height:97%;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

.tick{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:10px;
    transform-origin:0 0;
    background:rgba(255,183,115,.15);
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    border:1px solid rgba(255,180,105,.055);
    transform:translate(-50%,-50%) rotateX(68deg);
}

.orbit.a{
    width:84%;
    height:30%;
    animation:orbitA 17s linear infinite;
}

.orbit.b{
    width:70%;
    height:24%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg);
    animation:orbitB 23s linear infinite reverse;
}

.orbit.c{
    width:60%;
    height:20%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg);
    animation:orbitC 19s linear infinite;
}

.orbit-dot{
    position:absolute;
    left:50%;
    top:-4px;
    width:7px;
    height:7px;
    margin-left:-3.5px;
    border-radius:50%;
    background:#fff8ed;
    box-shadow:0 0 6px #fff,0 0 16px #ffae5a,0 0 30px #ff6500;
}

@keyframes orbitA{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(0)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg)}
}
@keyframes orbitB{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-300deg)}
}
@keyframes orbitC{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(302deg)}
}

#coreGlow{
    position:absolute;
    left:50%;
    top:50%;
    width:46%;
    height:46%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.15),rgba(255,211,164,.08) 11%,rgba(255,112,10,.05) 32%,transparent 70%);
    filter:blur(7px);
    animation:corePulse 3.7s ease-in-out infinite;
}

#coreBlack{
    position:absolute;
    left:50%;
    top:50%;
    width:28%;
    height:28%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#000;
    box-shadow:0 0 24px rgba(255,105,8,.18),0 0 68px rgba(255,72,0,.09),inset 0 0 20px rgba(255,120,20,.07);
}

#portalOpen{
    position:absolute;
    left:50%;
    top:50%;
    width:37%;
    height:37%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,194,124,.08);
    border-radius:50%;
    box-shadow:0 0 18px rgba(255,115,15,.035),inset 0 0 25px rgba(255,100,0,.035);
    animation:openPortal 2.8s ease-in-out infinite;
}

@keyframes corePulse{
    0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.28}
    50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}

@keyframes openPortal{
    0%,100%{transform:translate(-50%,-50%) scale(.86);opacity:.4}
    50%{transform:translate(-50%,-50%) scale(1.07);opacity:1}
}

#rune{
    position:absolute;
    left:50%;
    top:50%;
    width:min(27vmin,335px);
    height:min(27vmin,335px);
    min-width:155px;
    min-height:155px;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:18;
    will-change:transform,opacity,filter;
}

#rune svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.rune-path{
    fill:none;
    stroke:url(#g);
    stroke-width:7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-thin{
    fill:none;
    stroke:#fff9f0;
    stroke-width:3.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-orange{
    fill:none;
    stroke:#ff7914;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-solid{fill:#fffaf0}

#rune.show{
    animation:runeShow 2s cubic-bezier(.18,.8,.2,1) forwards;
}

@keyframes runeShow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.62) rotate(-12deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 4px rgba(255,255,255,1)) drop-shadow(0 0 10px rgba(255,226,190,1)) drop-shadow(0 0 22px rgba(255,155,50,.95)) drop-shadow(0 0 48px rgba(255,74,0,.72))}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 5px rgba(255,255,255,1)) drop-shadow(0 0 13px rgba(255,221,180,1)) drop-shadow(0 0 27px rgba(255,147,40,1)) drop-shadow(0 0 62px rgba(255,67,0,.78))}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.14) rotate(8deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}
}

#glyphs{
    width:min(55vmin,660px);
    height:min(55vmin,660px);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation:glyphSpin 86s linear infinite;
}

@keyframes glyphSpin{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

.glyph{
    position:absolute;
    left:50%;
    top:50%;
    color:rgba(255,211,171,.15);
    font-family:Georgia,serif;
    text-shadow:0 0 7px rgba(255,255,255,.10),0 0 18px rgba(255,100,0,.13);
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,215,180,.72);
    box-shadow:0 0 5px rgba(255,255,255,.4),0 0 12px rgba(255,120,20,.28);
    animation:particleMove var(--dur) linear infinite;
}

@keyframes particleMove{
    0%{transform:translate3d(0,0,0) scale(.2);opacity:0}
    15%{opacity:.6}
    50%{opacity:.25}
    82%{opacity:.65}
    100%{transform:translate3d(var(--x),var(--y),0) scale(1.7);opacity:0}
}

.spark{
    position:absolute;
    left:50%;
    top:50%;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px #fff,0 0 18px #ffad5c,0 0 35px #ff6500;
    opacity:0;
}

.spark.go{animation:spark 1.4s ease-out forwards}

@keyframes spark{
    0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(8px) scale(.2);opacity:1}
    100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) scale(0);opacity:0}
}

#pulse{
    position:absolute;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    transform:translate(-50%,-50%) scale(.1);
    border:1px solid rgba(255,190,120,.5);
    border-radius:50%;
    opacity:0;
    z-index:10;
}

#pulse.go{animation:pulse 2s ease-out forwards}

@keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(.1);opacity:.75}
    38%{opacity:.3}
    100%{transform:translate(-50%,-50%) scale(8);opacity:0}
}

#flash{
    position:absolute;
    inset:0;
    z-index:42;
    opacity:0;
    pointer-events:none;
    background:radial-gradient(circle at center,rgba(255,255,255,.10),rgba(255,124,25,.03) 19%,transparent 48%);
}

#flash.go{animation:flash .95s ease-out forwards}

@keyframes flash{
    0%{opacity:.72}
    100%{opacity:0}
}

#distortion{
    position:absolute;
    inset:0;
    z-index:45;
    pointer-events:none;
    opacity:.032;
    background:repeating-linear-gradient(to bottom,rgba(255,165,85,.10) 0,rgba(255,165,85,.10) 1px,transparent 2px,transparent 5px);
    mix-blend-mode:screen;
}

#vignette{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.68) 100%);
}

#soundHint{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:100;
    color:rgba(255,218,184,.38);
    font:10px/1 Arial,sans-serif;
    letter-spacing:4px;
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
}

#soundHint.visible{opacity:1}

@media(max-width:700px){
    #portal{width:83vmin;height:83vmin}
    #rune{width:34vmin;height:34vmin}
    #glyphs{width:74vmin;height:74vmin}
}
</style>
</head>

<body>

<div id="scene">
    <div id="camera">
        <canvas id="anomalyCanvas"></canvas>
        <div id="stars"></div>
        <div id="rays"></div>
        <div id="glyphs"></div>
        <div id="particles"></div>

        <div id="portal">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="ring r4"></div>
            <div class="ring r5"></div>
            <div id="ticks"></div>

            <div class="orbit a"><div class="orbit-dot"></div></div>
            <div class="orbit b"><div class="orbit-dot"></div></div>
            <div class="orbit c"><div class="orbit-dot"></div></div>

            <div id="portalOpen"></div>
            <div id="coreGlow"></div>
            <div id="coreBlack"></div>
        </div>

        <div id="sparks"></div>
        <div id="pulse"></div>
        <div id="rune"></div>
    </div>

    <div id="flash"></div>
    <div id="distortion"></div>
    <div id="vignette"></div>
</div>

<audio id="music" src="dave-deville-investigate-loopable.mp3" preload="auto" loop></audio>

const canvas=document.getElementById("anomalyCanvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,dpr=1;
let cycleStart=performance.now();
let seqIndex=0;
let currentType=0;
let previousType=0;

let cityL=[];
let cityR=[];
let worldPeopleL=[];
let worldPeopleR=[];
let worldCarsL=[];
let worldCarsR=[];

function makeCity(side){
    const list=[];
    const start=side==='L'?W*.015:W*.625;
    const end=side==='L'?W*.375:W*.985;
    let x=start;
    let id=0;
    while(x<end){
        const w=24+((id*17)%31);
        const h=55+((id*43)%170);
        list.push({
            x,
            w,
            h,
            seed:(id+1)*13.731+(side==='R'?91:0),
            antenna:id%5===0,
            id
        });
        x+=w+5+(id%4)*3;
        id++;
    }
    return list;
}

function makeWorldActors(side){
    const people=[];
    const cars=[];
    for(let i=0;i<14;i++){
        people.push({
            t:(i*.137+(side==='R'?.11:.03))%1,
            phase:i*.79+(side==='R'?1.8:0),
            scale:.75+(i%5)*.07
        });
    }
    for(let i=0;i<7;i++){
        cars.push({
            t:(i*.21+(side==='R'?.16:.02))%1,
            speed:.55+(i%4)*.08,
            lane:i%2
        });
    }
    return {people,cars};
}

const CYCLE=4300;

const anomalyNames=[
    "REALITY FRACTURE",
    "TELEPORTATION",
    "GRAVITATIONAL VOID",
    "LEVITATION EVENT",
    "MATTER COLLAPSE",
    "DIMENSIONAL IMPACT",
    "CHROMATIC RIFT"
];

const colors=[
    ["#00eaff","#458cff","#ff35d5"],
    ["#00eaff","#6edfff","#a45bff"],
    ["#8b5cff","#458cff","#00eaff"],
    ["#00f0ff","#458cff","#ff35d5"],
    ["#ff35d5","#8b5cff","#00eaff"],
    ["#00eaff","#ff35d5","#7c5cff"],
    ["#00f5ff","#b13cff","#ff2ba8"]
];

const sequence=[0,1,2,3,4,5,6,2,1,4,6,3];

function normalizePalette(palette){
    return Array.isArray(palette)&&palette.length>=3?palette:colors[0];
}

function resizeCanvas(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;
    H=innerHeight;
    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cityL=makeCity("L");
    cityR=makeCity("R");
    const l=makeWorldActors("L");
    const r=makeWorldActors("R");
    worldPeopleL=l.people;
    worldPeopleR=r.people;
    worldCarsL=l.cars;
    worldCarsR=r.cars;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

function clamp(v,a=0,b=1){
    return Math.max(a,Math.min(b,v));
}

function smooth(v){
    v=clamp(v);
    return v*v*(3-2*v);
}

function easeOut(v){
    v=clamp(v);
    return 1-Math.pow(1-v,3);
}

function sideX(side){
    return side==="L"?W*.25:W*.75;
}

function drawGlow(x,y,r,color,alpha){
    const g=ctx.createRadialGradient(x,y,0,x,y,r*5);
    g.addColorStop(0,color);
    g.addColorStop(.18,color);
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=alpha;
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(x,y,r*5,0,Math.PI*2);
    ctx.fill();
}

function worldProgress(now){
    return clamp((now-cycleStart)/CYCLE);
}

function drawCity(side,alpha,now,type,palette){
    palette=normalizePalette(palette);
    const list=side==='L'?cityL:cityR;
    const bounds=side==='L'?{a:W*.015,b:W*.375}:{a:W*.625,b:W*.985};
    const horizon=H*.81;
    const p=worldProgress(now);
    const isCollapse=type===4;
    const isBlackHole=type===2;
    const isExplosion=type===5;
    const isTeleport=type===1;
    const isRift=type===0||type===6;
    const centerFirst=smooth(clamp((p-.10)/.62));

    ctx.save();
    ctx.globalAlpha=alpha;

    for(const b of list){
        const centerFactor=side==='L'
            ?clamp((b.x-bounds.a)/(bounds.b-bounds.a))
            :clamp((bounds.b-(b.x+b.w))/(bounds.b-bounds.a));

        let localAlpha=1;
        let bx=b.x;
        let by=horizon-b.h;
        let bh=b.h;
        let wobble=0;

        if(isRift){
            const vanish= smooth(clamp((centerFirst-(centerFactor*.86-.02))/.55));
            localAlpha*=1-vanish*.97;
            wobble=Math.sin(now*.012+b.seed)*vanish*7;
            bx+=(Math.sign((side==='L'?1:-1))*(vanish*18));
            by+=Math.sin(b.seed+now*.009)*vanish*10;
            bh*=1-vanish*.22;
        }

        if(isCollapse){
            const c=smooth(clamp((p-.08)/.82));
            localAlpha*=1-c*.72;
            bx+=(side==='L'?1:-1)*c*(W*.09*centerFactor);
            by-=c*14*centerFactor;
            bh*=1-.32*c;
        }

        if(isBlackHole){
            const pull=smooth(clamp(1-Math.abs((b.x+b.w*.5)-(side==='L'?W*.19:W*.81))/(W*.19)));
            bx+=(side==='L'?1:-1)*pull*18;
            by-=pull*34;
            localAlpha*=1-pull*.38;
        }

        if(isExplosion){
            const e=1-smooth(clamp(p/.45));
            wobble=Math.sin(now*.04+b.seed)*e*7;
            bx+=wobble;
            by+=Math.cos(now*.03+b.seed)*e*5;
        }

        if(isTeleport){
            localAlpha*=.88+.12*Math.sin(b.seed+now*.005);
        }

        if(localAlpha<=.015)continue;

        ctx.globalAlpha=alpha*localAlpha*.72;
        ctx.fillStyle="rgba(7,10,16,.97)";
        ctx.fillRect(bx,by,b.w,bh);

        ctx.strokeStyle=palette[b.id%3];
        ctx.globalAlpha=alpha*localAlpha*.24;
        ctx.lineWidth=1.1;
        ctx.strokeRect(bx+.5,by+.5,b.w-1,bh-1);

        const cols=Math.max(1,Math.floor(b.w/13));
        const rows=Math.max(2,Math.floor(bh/21));
        for(let row=0;row<rows;row++){
            for(let col=0;col<cols;col++){
                const signal=Math.sin(b.seed+row*4.73+col*7.11);
                if(signal>.63){
                    ctx.fillStyle=row%3===0?palette[1]:palette[0];
                    ctx.globalAlpha=alpha*localAlpha*(.035+.035*Math.abs(signal));
                    ctx.fillRect(bx+5+col*12,by+8+row*18,4,6);
                }
            }
        }

        if(b.antenna && localAlpha>.2){
            ctx.strokeStyle=palette[0];
            ctx.globalAlpha=alpha*localAlpha*.18;
            ctx.beginPath();
            ctx.moveTo(bx+b.w*.5,by);
            ctx.lineTo(bx+b.w*.5,by-10-Math.sin(b.seed)*5);
            ctx.stroke();
        }
    }

    ctx.globalAlpha=alpha*.28;
    ctx.fillStyle=palette[0];
    ctx.fillRect(bounds.a,horizon,bounds.b-bounds.a,.7);

    ctx.restore();
}

function drawWorldPeople(side,alpha,now,type,palette){
    palette=normalizePalette(palette);
    const people=side==='L'?worldPeopleL:worldPeopleR;
    const a=side==='L'?W*.05:W*.66;
    const width=side==='L'?W*.30:W*.30;
    const yBase=H*.79;
    const p=worldProgress(now);

    ctx.save();
    for(let i=0;i<people.length;i++){
        const person=people[i];
        let x=a+((person.t+now*.000018*(.25+i%3))%1)*width;
        let y=yBase-5+Math.sin(person.phase+now*.003)*2;
        let local=alpha*.33;

        if(type===0||type===6){
            const disappear=smooth(clamp((p-.18)/.68))*(0.35+0.65*((i%5)/4));
            local*=1-disappear;
            x+=(side==='L'?1:-1)*disappear*42;
            y-=disappear*24;
        }

        if(type===2){
            const cx=side==='L'?W*.20:W*.80;
            const pull=smooth(clamp(1-Math.abs(x-cx)/(W*.16)));
            x+=(cx-x)*pull*.35;
            y-=pull*40;
            local*=1-pull*.5;
        }

        if(type===1){
            const beam=Math.max(0,Math.sin(now*.004+person.phase));
            if(beam>.93)local*=.12;
            if(beam>.80)y-=28*(beam-.80)*6;
        }

        if(local<.008)continue;

        ctx.globalAlpha=local;
        ctx.fillStyle="rgba(17,22,30,.97)";
        ctx.beginPath();
        ctx.arc(x,y-21,5.2*person.scale,0,Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x-7*person.scale,y-15);
        ctx.quadraticCurveTo(x-11*person.scale,y-1,x-6*person.scale,y+8);
        ctx.lineTo(x,y+12);
        ctx.lineTo(x+6*person.scale,y+8);
        ctx.quadraticCurveTo(x+11*person.scale,y-1,x+7*person.scale,y-15);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle=palette[i%3];
        ctx.globalAlpha=local*.35;
        ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(x-6,y-11);
        ctx.lineTo(x-11,y-2);
        ctx.moveTo(x+6,y-11);
        ctx.lineTo(x+11,y-2);
        ctx.stroke();

        if(type===1){
            const beam=Math.max(0,Math.sin(now*.004+person.phase));
            if(beam>.72){
                ctx.globalAlpha=local*.5;
                ctx.strokeStyle=palette[0];
                ctx.lineWidth=2;
                ctx.beginPath();
                ctx.moveTo(x,y+12);
                ctx.lineTo(x,y-62);
                ctx.stroke();
            }
        }
    }
    ctx.restore();
}

function drawRoadCars(side,alpha,now,type,palette){
    palette=normalizePalette(palette);
    const cars=side==='L'?worldCarsL:worldCarsR;
    const a=side==='L'?W*.045:W*.665;
    const width=W*.285;
    const roadY=H*.835;
    const p=worldProgress(now);

    ctx.save();
    for(let i=0;i<cars.length;i++){
        const car=cars[i];
        let x=a+((car.t+now*.00002*car.speed)%1)*width;
        let y=roadY+(car.lane?7:-4);
        let rot=0;
        let local=alpha*.27;

        if(type===2){
            const cx=side==='L'?W*.20:W*.80;
            const pull=smooth(clamp(1-Math.abs(x-cx)/(W*.18)));
            x+=(cx-x)*pull*.5;
            y-=pull*55;
            rot+=(side==='L'?-.6:.6)*pull;
        }

        if(type===3){
            y-=55+Math.sin(now*.0028+i)*38;
            rot=(side==='L'?-0.22:0.22)+Math.sin(i+now*.0015)*.32;
            local=alpha*.52;
        }

        if(type===5){
            const e=1-smooth(clamp(p/.5));
            x+=Math.cos(i+now*.004)*e*60;
            y+=Math.sin(i*2+now*.003)*e*38;
            rot+=Math.sin(i+now*.003)*e*.7;
            local=alpha*.38;
        }

        if(type===0||type===6){
            const disappear=smooth(clamp((p-.08)/.78))*(.25+.75*(i/Math.max(1,cars.length-1)));
            local*=1-disappear;
            x+=(side==='L'?1:-1)*disappear*55;
        }

        if(local<.01)continue;

        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(rot);
        ctx.globalAlpha=local;

        const body=ctx.createLinearGradient(-22,-7,22,7);
        body.addColorStop(0,"rgba(8,12,18,.98)");
        body.addColorStop(.5,"rgba(37,47,60,.98)");
        body.addColorStop(1,"rgba(5,8,12,.98)");
        ctx.fillStyle=body;
        ctx.beginPath();
        ctx.moveTo(-25,4);
        ctx.lineTo(-15,-6);
        ctx.quadraticCurveTo(-2,-12,13,-7);
        ctx.lineTo(24,2);
        ctx.lineTo(22,7);
        ctx.lineTo(-23,7);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle=palette[0];
        ctx.lineWidth=1.4;
        ctx.beginPath();
        ctx.moveTo(-21,6);
        ctx.lineTo(21,6);
        ctx.stroke();

        ctx.fillStyle=palette[1];
        ctx.globalAlpha=local*.65;
        ctx.fillRect(-17,0,6,2.5);
        ctx.fillRect(11,0,6,2.5);

        ctx.restore();
    }
    ctx.restore();
}

function drawPerspectiveField(side,alpha,now){
    const cx=sideX(side);
    const base=H*.80;
    const span=W*.29;

    ctx.save();
    ctx.globalAlpha=alpha*.58;

    for(let i=0;i<9;i++){
        const y=base-i*25-Math.sin(now*.001+i)*2;
        const w=span*(1-i*.055);

        ctx.strokeStyle=i%2?"rgba(0,234,255,.08)":"rgba(139,92,255,.075)";
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx-w,y);
        ctx.quadraticCurveTo(cx,y-24-i*2,cx+w,y);
        ctx.stroke();
    }

    for(let i=-6;i<=6;i++){
        ctx.strokeStyle="rgba(0,234,255,.055)";
        ctx.beginPath();
        ctx.moveTo(cx+i*17,base);
        ctx.lineTo(cx+i*49,H*.56);
        ctx.stroke();
    }

    ctx.restore();
}

function drawVanishingShards(side,alpha,now){
    const cx=sideX(side);
    const cy=H*.53;
    const p=clamp((now-cycleStart)/CYCLE);
    const appear=smooth(clamp(p/.22));
    const vanish=smooth(clamp((p-.60)/.36));

    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalAlpha=alpha*appear*(1-vanish*.95);

    for(let i=0;i<11;i++){
        const angle=-1.2+i*.24;
        const dist=120+(i%4)*32;
        const x=Math.cos(angle)*dist;
        const y=Math.sin(angle)*dist;
        const h=45+(i%5)*18;
        const w=14+(i%4)*7;

        ctx.save();
        ctx.translate(x,y);
        ctx.rotate((i%2?.15:-.15));

        const shard=ctx.createLinearGradient(-w,0,w,0);
        shard.addColorStop(0,"rgba(8,18,28,.9)");
        shard.addColorStop(.45,"rgba(38,55,75,.82)");
        shard.addColorStop(1,"rgba(2,8,14,.96)");

        ctx.fillStyle=shard;
        ctx.strokeStyle=colors[0][i%3];
        ctx.globalAlpha=alpha*appear*(1-vanish*.95)*.65;

        ctx.beginPath();
        ctx.moveTo(-w,-h*.5);
        ctx.lineTo(w*.55,-h*.35);
        ctx.lineTo(w,h*.48);
        ctx.lineTo(-w*.6,h*.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        for(let k=0;k<3;k++){
            ctx.strokeStyle=colors[(i+k)%3];
            ctx.globalAlpha=alpha*.15*(1-vanish);
            ctx.beginPath();
            ctx.moveTo(-w*.7,-h*.15+k*8);
            ctx.lineTo(w*.65,-h*.05+k*8);
            ctx.stroke();
        }

        ctx.restore();
    }

    if(vanish>.02){
        ctx.globalAlpha=alpha*vanish*.55;
        ctx.strokeStyle="#00eaff";
        ctx.lineWidth=2;
        for(let i=0;i<20;i++){
            const ang=Math.random()*Math.PI*2;
            const r=30+Math.random()*170;
            ctx.beginPath();
            ctx.moveTo(Math.cos(ang)*r*.2,Math.sin(ang)*r*.2);
            ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function drawFloatingVehicle(x,y,scale,angle,alpha,now,palette){
    palette=normalizePalette(palette);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.scale(scale,scale);
    ctx.globalAlpha=alpha;

    ctx.shadowBlur=18;
    ctx.shadowColor=palette[0];

    const body=ctx.createLinearGradient(-48,-14,48,12);
    body.addColorStop(0,"rgba(18,24,34,.98)");
    body.addColorStop(.5,"rgba(62,67,78,.97)");
    body.addColorStop(1,"rgba(7,11,18,.98)");

    ctx.fillStyle=body;
    ctx.beginPath();
    ctx.moveTo(-48,2);
    ctx.lineTo(-35,-14);
    ctx.quadraticCurveTo(-5,-27,28,-17);
    ctx.lineTo(47,-4);
    ctx.lineTo(51,8);
    ctx.lineTo(-42,11);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="rgba(115,225,255,.34)";
    ctx.beginPath();
    ctx.moveTo(-23,-13);
    ctx.lineTo(-2,-20);
    ctx.lineTo(23,-14);
    ctx.lineTo(28,-4);
    ctx.lineTo(-28,-4);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle=palette[0];
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-41,7);
    ctx.lineTo(43,7);
    ctx.stroke();

    ctx.fillStyle=palette[1];
    ctx.shadowBlur=13;
    ctx.shadowColor=palette[1];
    ctx.fillRect(-35,3,8,3);
    ctx.fillRect(29,3,8,3);
    ctx.shadowBlur=0;

    ctx.fillStyle="#061017";
    ctx.beginPath();
    ctx.arc(-29,11,8,0,Math.PI*2);
    ctx.arc(29,11,8,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="rgba(220,250,255,.2)";
    ctx.lineWidth=1.3;
    ctx.beginPath();
    ctx.arc(-29,11,8,0,Math.PI*2);
    ctx.arc(29,11,8,0,Math.PI*2);
    ctx.stroke();

    const hover=3+Math.sin(now*.006+x*.002)*2;
    ctx.strokeStyle=palette[0];
    ctx.globalAlpha=alpha*.5;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-33,18);
    ctx.lineTo(-20,18+hover);
    ctx.moveTo(33,18);
    ctx.lineTo(20,18+hover);
    ctx.stroke();

    ctx.restore();
}

function drawHumanEcho(x,y,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.globalAlpha=alpha;

    const glow=ctx.createRadialGradient(0,-25,0,0,-25,72);
    glow.addColorStop(0,palette[0]);
    glow.addColorStop(.35,palette[1]);
    glow.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.arc(0,-22,72,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=26;
    ctx.shadowColor=palette[0];
    ctx.fillStyle="rgba(222,251,255,.30)";

    ctx.beginPath();
    ctx.arc(0,-58,13,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-14,-43);
    ctx.bezierCurveTo(-24,-20,-23,11,-13,29);
    ctx.bezierCurveTo(-8,38,-4,46,0,52);
    ctx.bezierCurveTo(5,45,9,38,13,29);
    ctx.bezierCurveTo(23,11,24,-20,14,-43);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur=0;
    ctx.strokeStyle=palette[0];
    ctx.lineWidth=2.7;

    ctx.beginPath();
    ctx.arc(0,-58,13,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-13,-41);
    ctx.bezierCurveTo(-26,-12,-24,18,-12,35);
    ctx.moveTo(13,-41);
    ctx.bezierCurveTo(26,-12,24,18,12,35);
    ctx.stroke();

    ctx.strokeStyle=palette[2];
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-7,-30);
    ctx.lineTo(7,-30);
    ctx.moveTo(-7,-8);
    ctx.lineTo(7,-8);
    ctx.stroke();

    for(let i=0;i<14;i++){
        const a=now*.005+i*.45;
        const rr=38+(i%4)*5;
        const px=Math.cos(a)*rr;
        const py=-26+Math.sin(a)*rr*1.45;
        ctx.fillStyle=i%2?palette[0]:palette[2];
        ctx.globalAlpha=alpha*.5;
        ctx.fillRect(px,py,2.4,2.4);
    }

    ctx.restore();
}

function drawRift(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);

    ctx.filter="blur(13px)";
    const glow=ctx.createLinearGradient(-35,0,35,0);
    glow.addColorStop(0,"rgba(0,0,0,0)");
    glow.addColorStop(.35,palette[0]);
    glow.addColorStop(.5,palette[1]);
    glow.addColorStop(.65,palette[2]);
    glow.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=glow;
    ctx.globalAlpha=alpha*.6;
    ctx.beginPath();
    ctx.moveTo(-55,-178);
    ctx.lineTo(16,-105);
    ctx.lineTo(-18,-30);
    ctx.lineTo(47,48);
    ctx.lineTo(-8,178);
    ctx.lineTo(-44,88);
    ctx.lineTo(3,-4);
    ctx.closePath();
    ctx.fill();

    ctx.filter="none";
    ctx.globalAlpha=alpha;
    ctx.shadowBlur=26;
    ctx.shadowColor=palette[0];

    ctx.strokeStyle=palette[0];
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(-23,-170);
    ctx.lineTo(14,-101);
    ctx.lineTo(-9,-31);
    ctx.lineTo(29,44);
    ctx.lineTo(-3,170);
    ctx.stroke();

    ctx.strokeStyle=palette[2];
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(2,-168);
    ctx.lineTo(-32,-99);
    ctx.lineTo(12,-31);
    ctx.lineTo(-18,45);
    ctx.lineTo(5,169);
    ctx.stroke();

    ctx.shadowBlur=0;

    for(let i=0;i<34;i++){
        const t=i/33;
        const y=-160+t*320;
        const x=Math.sin(t*15+now*.003)*36;
        ctx.globalAlpha=alpha*(.12+.22*Math.sin(i*2.1)**2);
        ctx.fillStyle=i%3===0?palette[2]:palette[0];
        ctx.fillRect(x,y,2+Math.random()*3,2+Math.random()*8);
    }

    ctx.restore();
}

function drawBlackHole(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    ctx.globalAlpha=alpha;

    const outer=116;
    const g=ctx.createRadialGradient(0,0,0,0,0,outer);
    g.addColorStop(0,"rgba(0,0,0,1)");
    g.addColorStop(.26,"rgba(0,0,3,1)");
    g.addColorStop(.45,"rgba(18,5,45,.99)");
    g.addColorStop(.58,palette[1]);
    g.addColorStop(.72,"rgba(0,234,255,.09)");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,outer,0,Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.rotate(now*.00055);

    for(let i=0;i<4;i++){
        ctx.strokeStyle=palette[i%3];
        ctx.globalAlpha=alpha*(.33-i*.055);
        ctx.lineWidth=5-i*.8;
        ctx.beginPath();
        ctx.ellipse(0,0,92-i*15,31-i*5,0,0,Math.PI*2);
        ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(0,0,32,0,Math.PI*2);
    ctx.fill();

    for(let i=0;i<38;i++){
        const a=i*(Math.PI*2/38)+now*.0008;
        const rr=56+Math.sin(i*2.8)*28;
        const x=Math.cos(a)*rr;
        const y=Math.sin(a)*rr*.42;
        ctx.fillStyle=i%2?palette[0]:palette[2];
        ctx.globalAlpha=alpha*.42;
        ctx.fillRect(x,y,2+Math.random()*2,2+Math.random()*2);
    }

    ctx.restore();
}

function drawExplosion(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    const t=clamp((now-cycleStart)/2100);
    if(t>1)return;

    const p=easeOut(t);
    const radius=25+p*155;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    ctx.globalAlpha=alpha*(1-t*.85);

    const g=ctx.createRadialGradient(0,0,0,0,0,radius);
    g.addColorStop(0,"rgba(255,255,255,.95)");
    g.addColorStop(.10,palette[0]);
    g.addColorStop(.28,palette[2]);
    g.addColorStop(.50,palette[1]+"66");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(0,0,radius,0,Math.PI*2);
    ctx.fill();

    for(let i=0;i<38;i++){
        const a=i*(Math.PI*2/52)+p*5;
        const rr=radius*(.16+.95*Math.abs(Math.sin(i*4.71)));
        const x=Math.cos(a)*rr;
        const y=Math.sin(a)*rr*.76;

        ctx.fillStyle=i%3===0?palette[0]:palette[2];
        ctx.globalAlpha=alpha*(1-t)*(.28+.56*Math.random());
        ctx.fillRect(x,y,2+Math.random()*6,2+Math.random()*6);
    }

    ctx.restore();
}

function drawMatterCollapse(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    const p=clamp((now-cycleStart)/CYCLE);
    const collapse=smooth(clamp((p-.03)/.70));
    const vanish=smooth(clamp((p-.66)/.30));

    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);

    for(let r=0;r<9;r++){
        for(let c=0;c<8;c++){
            const ox=(c-3.5)*23;
            const oy=(r-4)*22;
            const drift=Math.sin((c+r)*1.8+now*.002)*7;
            const x=ox*(1-collapse)+Math.sign(ox||1)*drift*(1-collapse);
            const y=oy*(1-collapse);
            const s=7*(1-.53*collapse);

            ctx.globalAlpha=alpha*(.34+.66*Math.sin((c+r*4.3)*1.7)**2)*(1-.88*vanish);
            ctx.fillStyle=c%3===0?palette[0]:(c%3===1?palette[1]:palette[2]);
            ctx.shadowBlur=12;
            ctx.shadowColor=ctx.fillStyle;
            ctx.fillRect(x-s/2,y-s/2,s,s);
        }
    }

    ctx.shadowBlur=0;
    ctx.restore();
}

function drawLevitation(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    const t=(now-cycleStart)/1000;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);

    drawFloatingVehicle(-92,-38+Math.sin(t*2)*48,.92,Math.sin(t*1.7)*.48,alpha,palette);
    drawFloatingVehicle(10,22+Math.sin(t*2.3+1)*55,.78,-.25+Math.sin(t*1.5)*.45,alpha,palette);
    drawFloatingVehicle(91,-15+Math.cos(t*1.8+1)*42,.88,.28+Math.cos(t*1.4)*.4,alpha,palette);

    ctx.restore();
}

function drawTeleportation(cx,cy,scale,alpha,now,palette){
    palette=normalizePalette(palette);
    const t=clamp((now-cycleStart)/1800);
    const r=62+easeOut(t)*58;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);

    for(let i=0;i<4;i++){
        ctx.strokeStyle=palette[i%3];
        ctx.lineWidth=3-i*.45;
        ctx.shadowBlur=22;
        ctx.shadowColor=palette[i%3];
        ctx.globalAlpha=alpha*(.75-i*.12);
        ctx.beginPath();
        ctx.ellipse(0,0,r+i*12,r*.32+i*5,0,0,Math.PI*2);
        ctx.stroke();
    }

    ctx.shadowBlur=0;

    const appear=1-Math.min(1,t*.95);
    if(appear>.02){
        drawHumanEcho(0,52,1+.18*Math.sin(t*8),alpha*appear,now,palette);
    }

    for(let i=0;i<46;i++){
        const a=i*(Math.PI*2/46)+now*.001;
        const rr=70+Math.sin(i*1.9)*38;
        ctx.fillStyle=i%2?palette[0]:palette[2];
        ctx.globalAlpha=alpha*(.10+.30*Math.abs(Math.sin(i*2.1+now*.004)));
        ctx.fillRect(Math.cos(a)*rr,Math.sin(a)*rr*.36,2.2,2.2);
    }

    ctx.restore();
}

function drawAnomaly(type,side,alpha,now){
    if(alpha<=.001)return;

    const cx=sideX(side);
    const cy=H*.53;
    const safeType=Number.isInteger(type)&&type>=0&&type<colors.length?type:0;
    const palette=colors[safeType]||colors[0];
    const scale=Math.min(W,H)/900;

    drawCity(side,alpha,now,safeType,palette);
    drawWorldPeople(side,alpha,now,safeType,palette);
    drawRoadCars(side,alpha,now,safeType,palette);

    if(safeType===0){
        drawPerspectiveField(side,alpha,now);
        drawVanishingShards(side,alpha,now);
        drawRift(cx,cy,scale,alpha,now,palette);
    }

    if(safeType===1) drawTeleportation(cx,cy,scale,alpha,now,palette);
    if(safeType===2) drawBlackHole(cx,cy,scale,alpha,now,palette);

    if(safeType===3){
        drawPerspectiveField(side,alpha*.45,now);
        drawLevitation(cx,cy,scale,alpha,now,palette);
    }

    if(safeType===4) drawMatterCollapse(cx,cy,scale,alpha,now,palette);
    if(safeType===5) drawExplosion(cx,cy,scale,alpha,now,palette);
    if(safeType===6) drawRift(cx,cy,scale,alpha,now,palette);
}

function drawTransitionTear(side,now){
    const p=clamp((now-cycleStart)/CYCLE);
    if(p<.03||p>.25)return;

    const t=smooth((p-.03)/.22);
    const cx=sideX(side);
    const w=130+190*Math.sin(Math.PI*t);

    ctx.save();
    ctx.globalCompositeOperation="screen";

    const g=ctx.createLinearGradient(cx-w,0,cx+w,0);
    g.addColorStop(0,"rgba(0,234,255,0)");
    g.addColorStop(.32,"rgba(0,234,255,.025)");
    g.addColorStop(.5,"rgba(255,53,213,.18)");
    g.addColorStop(.68,"rgba(139,92,255,.045)");
    g.addColorStop(1,"rgba(0,234,255,0)");

    ctx.fillStyle=g;
    ctx.fillRect(cx-w,H*.10,w*2,H*.72);

    ctx.strokeStyle="rgba(0,234,255,.12)";
    ctx.lineWidth=2;

    for(let i=0;i<12;i++){
        const y=H*.13+i*45;
        const w2=30+Math.random()*90;
        ctx.beginPath();
        ctx.moveTo(cx-w2,y);
        ctx.lineTo(cx+Math.random()*w2,y+Math.sin(i+now*.005)*12);
        ctx.stroke();
    }

    ctx.restore();
}

function nextAnomaly(now){
    previousType=Number.isInteger(currentType)&&currentType>=0&&currentType<colors.length?currentType:0;
    seqIndex=(seqIndex+1)%sequence.length;
    const nextType=sequence[seqIndex];
    currentType=Number.isInteger(nextType)&&nextType>=0&&nextType<colors.length?nextType:0;
    cycleStart=now;
}

let anomalyFrameTime=0;
const ANOMALY_FRAME_MS=1000/30;

function animate(now){
    if(now-anomalyFrameTime<ANOMALY_FRAME_MS){
        requestAnimationFrame(animate);
        return;
    }
    anomalyFrameTime=now;

    if(now-cycleStart>=CYCLE) nextAnomaly(now);

    ctx.clearRect(0,0,W,H);

    const p=clamp((now-cycleStart)/CYCLE);
    let inAlpha=1;
    let outAlpha=0;

    if(p<.21){
        inAlpha=smooth(p/.21);
        outAlpha=1-inAlpha;
    }else if(p>.78){
        outAlpha=smooth((p-.78)/.22);
        inAlpha=1-outAlpha;
    }

    drawAnomaly(previousType,"L",outAlpha*.8,now);
    drawAnomaly(previousType,"R",outAlpha*.8,now);
    drawAnomaly(currentType,"L",inAlpha,now);
    drawAnomaly(currentType,"R",inAlpha,now);
    drawTransitionTear("L",now);
    drawTransitionTear("R",now);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
