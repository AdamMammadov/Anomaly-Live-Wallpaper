<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARCANE PORTAL</title>

<style>
:root{
    --orange:#ff6b0a;
    --amber:#ffad55;
    --white:#fffaf2;
    --gold:#ffd7aa;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    cursor:none;
    position:relative;
    user-select:none;
}

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,92,0,.055),transparent 25%),
        radial-gradient(circle at 50% 50%,rgba(255,160,65,.025),transparent 48%),
        #000;
}

#camera{
    position:absolute;
    inset:-2%;
    transform-origin:center;
    will-change:transform;
}

#stars,
#particles,
#sparks,
#rays,
#symbols{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#stars{z-index:1}
#rays{z-index:2}
#symbols{z-index:3}
#particles{z-index:4}
#sparks{z-index:8}

.star{
    position:absolute;
    width:1px;
    height:1px;
    border-radius:50%;
    background:rgba(255,220,185,.7);
    box-shadow:0 0 5px rgba(255,130,30,.4);
    animation:twinkle var(--d) ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.05;transform:scale(.4)}
    50%{opacity:var(--o);transform:scale(1.7)}
}

.ray{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:48vh;
    transform-origin:50% 100%;
    background:linear-gradient(
        to top,
        rgba(255,142,30,0),
        rgba(255,180,95,.02),
        rgba(255,235,205,.13),
        rgba(255,111,10,0)
    );
    filter:blur(1px);
    opacity:.15;
}

#portal{
    position:absolute;
    left:50%;
    top:50%;
    width:min(66vmin,760px);
    height:min(66vmin,760px);
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
}

.portal-core{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
}

.core-glow{
    width:43%;
    height:43%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.14) 0%,
            rgba(255,211,164,.08) 12%,
            rgba(255,112,10,.05) 30%,
            rgba(255,65,0,0) 72%
        );
    filter:blur(7px);
    animation:corePulse 3.7s ease-in-out infinite;
}

.core-black{
    width:28%;
    height:28%;
    background:#000;
    box-shadow:
        0 0 20px rgba(255,110,10,.18),
        0 0 60px rgba(255,72,0,.08),
        inset 0 0 20px rgba(255,115,20,.07);
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,155,68,.12);
}

.r1{
    width:100%;
    height:100%;
    border-color:rgba(255,135,35,.08);
    box-shadow:
        0 0 20px rgba(255,100,10,.03),
        inset 0 0 20px rgba(255,100,10,.025);
    animation:spin1 48s linear infinite;
}

.r2{
    width:91%;
    height:91%;
    border-style:dashed;
    border-color:rgba(255,212,160,.055);
    animation:spin2 34s linear infinite reverse;
}

.r3{
    width:78%;
    height:78%;
    border-color:rgba(255,143,37,.12);
    box-shadow:
        0 0 35px rgba(255,100,0,.06),
        inset 0 0 25px rgba(255,110,10,.04);
    animation:spin1 25s linear infinite;
}

.r4{
    width:66%;
    height:66%;
    border-style:dotted;
    border-color:rgba(255,214,175,.09);
    animation:spin2 18s linear infinite reverse;
}

.r5{
    width:53%;
    height:53%;
    border-color:rgba(255,122,17,.12);
    animation:spin1 13s linear infinite;
}

@keyframes spin1{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes spin2{
    from{transform:translate(-50%,-50%) rotate(360deg)}
    to{transform:translate(-50%,-50%) rotate(0deg)}
}

@keyframes corePulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.8);
        opacity:.25;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.13);
        opacity:1;
    }
}

.tick-ring{
    position:absolute;
    left:50%;
    top:50%;
    width:97%;
    height:97%;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

.tick{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:10px;
    transform-origin:0 0;
    background:rgba(255,186,116,.16);
    box-shadow:0 0 5px rgba(255,100,0,.15);
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    border:1px solid rgba(255,169,90,.055);
    transform:translate(-50%,-50%) rotateX(68deg);
    box-shadow:0 0 25px rgba(255,100,0,.025);
}

.orbit.a{
    width:84%;
    height:30%;
    animation:orbitA 17s linear infinite;
}

.orbit.b{
    width:70%;
    height:24%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg);
    animation:orbitB 23s linear infinite reverse;
}

.orbit.c{
    width:60%;
    height:20%;
    transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg);
    animation:orbitC 19s linear infinite;
}

@keyframes orbitA{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(0)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg)}
}

@keyframes orbitB{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(60deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-300deg)}
}

@keyframes orbitC{
    from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-58deg)}
    to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(302deg)}
}

.orbit-dot{
    position:absolute;
    left:50%;
    top:-4px;
    width:7px;
    height:7px;
    margin-left:-3.5px;
    border-radius:50%;
    background:#fff8ed;
    box-shadow:
        0 0 6px #fff,
        0 0 15px #ffb05c,
        0 0 28px #ff6500;
}

#rune{
    position:absolute;
    left:50%;
    top:50%;
    width:min(27vmin,325px);
    height:min(27vmin,325px);
    min-width:155px;
    min-height:155px;
    transform:translate(-50%,-50%);
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    will-change:transform,opacity,filter;
}

#rune svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.rune-path{
    fill:none;
    stroke:url(#g);
    stroke-width:7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-thin{
    fill:none;
    stroke:#fff9f0;
    stroke-width:3.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-orange{
    fill:none;
    stroke:#ff7914;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rune-solid{
    fill:#fff9ef;
}

#rune.show{
    animation:runeShow 2s cubic-bezier(.18,.8,.2,1) forwards;
}

@keyframes runeShow{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.62) rotate(-12deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,90,0,0));
    }
    12%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0);
        filter:
            drop-shadow(0 0 4px rgba(255,255,255,1))
            drop-shadow(0 0 10px rgba(255,226,191,1))
            drop-shadow(0 0 22px rgba(255,155,52,.95))
            drop-shadow(0 0 48px rgba(255,74,0,.72));
    }
    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0);
        filter:
            drop-shadow(0 0 5px rgba(255,255,255,1))
            drop-shadow(0 0 13px rgba(255,221,180,1))
            drop-shadow(0 0 26px rgba(255,147,39,1))
            drop-shadow(0 0 62px rgba(255,67,0,.78));
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.14) rotate(8deg);
        filter:
            drop-shadow(0 0 0 rgba(255,255,255,0))
            drop-shadow(0 0 0 rgba(255,80,0,0));
    }
}

#glyphs{
    position:absolute;
    left:50%;
    top:50%;
    width:min(54vmin,640px);
    height:min(54vmin,640px);
    transform:translate(-50%,-50%);
    z-index:7;
    pointer-events:none;
    animation:glyphSpin 85s linear infinite;
}

@keyframes glyphSpin{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

.glyph{
    position:absolute;
    left:50%;
    top:50%;
    color:rgba(255,208,166,.18);
    font-family:Georgia,serif;
    text-shadow:
        0 0 6px rgba(255,255,255,.12),
        0 0 18px rgba(255,102,0,.15);
    opacity:.4;
}

#portalOpen{
    position:absolute;
    left:50%;
    top:50%;
    width:37%;
    height:37%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(255,194,124,.08);
    box-shadow:
        0 0 15px rgba(255,120,20,.04),
        0 0 45px rgba(255,75,0,.035),
        inset 0 0 25px rgba(255,100,0,.03);
    animation:openPortal 2.8s ease-in-out infinite;
}

@keyframes openPortal{
    0%,100%{
        transform:translate(-50%,-50%) scale(.86);
        opacity:.4;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.07);
        opacity:1;
    }
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,215,180,.7);
    box-shadow:
        0 0 5px rgba(255,255,255,.4),
        0 0 12px rgba(255,120,20,.3);
    animation:particleMove var(--dur) linear infinite;
}

@keyframes particleMove{
    0%{
        transform:translate3d(0,0,0) scale(.2);
        opacity:0;
    }
    15%{opacity:.6}
    50%{opacity:.25}
    80%{opacity:.65}
    100%{
        transform:translate3d(var(--x),var(--y),0) scale(1.7);
        opacity:0;
    }
}

.spark{
    position:absolute;
    left:50%;
    top:50%;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 6px #fff,
        0 0 18px #ffad5c,
        0 0 35px #ff6500;
    opacity:0;
    transform:translate(-50%,-50%);
}

.spark.go{
    animation:spark 1.4s ease-out forwards;
}

@keyframes spark{
    0%{
        transform:translate(-50%,-50%) rotate(var(--a)) translateX(10px) scale(.2);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) scale(0);
        opacity:0;
    }
}

#pulse{
    position:absolute;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    border-radius:50%;
    border:1px solid rgba(255,187,115,.5);
    transform:translate(-50%,-50%) scale(.1);
    opacity:0;
    z-index:6;
    pointer-events:none;
}

#pulse.go{
    animation:pulse 2s ease-out forwards;
}

@keyframes pulse{
    0%{
        transform:translate(-50%,-50%) scale(.1);
        opacity:.7;
    }
    38%{opacity:.3}
    100%{
        transform:translate(-50%,-50%) scale(8);
        opacity:0;
    }
}

#distortion{
    position:absolute;
    inset:0;
    z-index:30;
    pointer-events:none;
    opacity:.06;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,160,80,.12) 0px,
            rgba(255,160,80,.12) 1px,
            transparent 2px,
            transparent 5px
        );
    mix-blend-mode:screen;
}

#vignette{
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 34%,
            rgba(0,0,0,.18) 58%,
            rgba(0,0,0,.5) 100%
        );
}

#flash{
    position:absolute;
    inset:0;
    z-index:50;
    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.08),
            rgba(255,126,25,.035) 18%,
            transparent 48%
        );
    opacity:0;
    pointer-events:none;
}

#flash.go{
    animation:flash 1.2s ease-out forwards;
}

@keyframes flash{
    0%{opacity:.8}
    100%{opacity:0}
}

@media(max-width:700px){
    #portal{
        width:82vmin;
        height:82vmin;
    }

    #rune{
        width:34vmin;
        height:34vmin;
    }

    #glyphs{
        width:72vmin;
        height:72vmin;
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        animation-duration:1ms !important;
        animation-iteration-count:1 !important;
    }
}
</style>
</head>

const glyphSet=[
    "ᚦ","ᛉ","ᚨ","ᛟ","ᚱ","ᚲ","ᛏ","ᚹ",
    "ϟ","Ψ","Ж","Ȝ","Ƶ","ƛ","⟐","⟁",
    "⟡","◈","⊙","⌁","⋔","ᛝ","ᚾ","ᛒ",
    "⟁","⌬","⟟","⧫","◌","◉","⋈","⟡"
];

const rune=document.getElementById("rune");
const pulse=document.getElementById("pulse");
const flash=document.getElementById("flash");
const sparks=document.getElementById("sparks");
const ticks=document.getElementById("ticks");
const symbols=document.getElementById("symbols");
const particles=document.getElementById("particles");
const stars=document.getElementById("stars");
const rays=document.getElementById("rays");
const glyphs=document.getElementById("glyphs");
const camera=document.getElementById("camera");

let runeIndex=0;

for(let i=0;i<100;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.setProperty("--d",(2+Math.random()*6)+"s");
    s.style.setProperty("--o",(0.15+Math.random()*.65).toFixed(2));
    s.style.animationDelay=(-Math.random()*8)+"s";
    stars.appendChild(s);
}

for(let i=0;i<34;i++){
    const ray=document.createElement("div");
    ray.className="ray";
    ray.style.transform=
        `translate(-50%,-100%) rotate(${i*(360/34)}deg)`;
    ray.style.opacity=(.04+Math.random()*.12).toFixed(3);
    rays.appendChild(ray);
}

for(let i=0;i<72;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.top=Math.random()*100+"%";
    p.style.setProperty("--x",((Math.random()-.5)*300)+"px");
    p.style.setProperty("--y",(-50-Math.random()*350)+"px");
    p.style.setProperty("--dur",(5+Math.random()*12)+"s");
    p.style.animationDelay=(-Math.random()*15)+"s";
    const size=.7+Math.random()*2;
    p.style.width=size+"px";
    p.style.height=size+"px";
    particles.appendChild(p);
}

for(let i=0;i<40;i++){
    const t=document.createElement("div");
    t.className="tick";
    const a=i*(360/40);
    t.style.transform=
        `translate(-50%,-50%) rotate(${a}deg) translateY(-48%)`;
    ticks.appendChild(t);
}

glyphSet.forEach((g,i)=>{
    const el=document.createElement("div");
    el.className="glyph";
    el.textContent=g;

    const angle=i*(360/glyphSet.length);
    const radius=44+(i%4)*2;

    el.style.fontSize=(13+(i%5)*2)+"px";
    el.style.transform=
        `translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}%) rotate(${-angle}deg)`;

    el.style.opacity=(.08+(i%5)*.025).toFixed(3);
    glyphs.appendChild(el);
});

glyphSet.slice(0,18).forEach((g,i)=>{
    const el=document.createElement("div");
    el.className="glyph";
    el.textContent=g;

    const angle=i*(360/18)+10;
    const radius=34+(i%3)*2;

    el.style.fontSize=(10+(i%4)*2)+"px";
    el.style.color="rgba(255,170,95,.09)";
    el.style.transform=
        `translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}%) rotate(${-angle}deg)`;

    symbols.appendChild(el);
});

function createSpark(){
    const s=document.createElement("div");
    s.className="spark";
    s.style.setProperty("--a",(Math.random()*360)+"deg");
    s.style.setProperty("--r",(120+Math.random()*280)+"px");
    sparks.appendChild(s);

    requestAnimationFrame(()=>{
        s.classList.add("go");
    });

    setTimeout(()=>s.remove(),1500);
}

function energyBurst(){
    pulse.classList.remove("go");
    void pulse.offsetWidth;
    pulse.classList.add("go");

    flash.classList.remove("go");
    void flash.offsetWidth;
    flash.classList.add("go");

    for(let i=0;i<10;i++){
        setTimeout(createSpark,i*45);
    }
}

function showRune(){
    rune.classList.remove("show");
    void rune.offsetWidth;

    rune.innerHTML=runes[runeIndex];
    rune.classList.add("show");

    energyBurst();

    runeIndex=(runeIndex+1)%runes.length;
}

showRune();
setInterval(showRune,2000);

let mx=0;
let my=0;
let tx=0;
let ty=0;

window.addEventListener("mousemove",e=>{
    tx=(e.clientX/window.innerWidth-.5)*2;
    ty=(e.clientY/window.innerHeight-.5)*2;
});

let last=performance.now();

function cameraLoop(now){
    const dt=now-last;
    last=now;

    mx+=(tx-mx)*.018;
    my+=(ty-my)*.018;

    const t=now*.00025;

    const breathe=Math.sin(t)*.003;
    const driftX=Math.sin(t*1.17)*1.8;
    const driftY=Math.cos(t*.91)*1.8;

    camera.style.transform=
        `translate3d(${driftX+mx*3}px,${driftY+my*3}px,0) scale(${1.005+breathe})`;

    requestAnimationFrame(cameraLoop);
}

requestAnimationFrame(cameraLoop);

let pulseTimer=0;

setInterval(()=>{
    if(Math.random()>.35){
        createSpark();
    }
},430);

document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
        document.body.style.cursor="default";
    }else{
        document.body.style.cursor="none";
    }
});

</script>
