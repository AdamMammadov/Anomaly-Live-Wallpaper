<!DOCTYPE html>
<html lang="en">
<head>

<title>ARCANE PORTAL — Cinematic Anomaly</title>
<style>
:root{
  --orange:#ff6a08;
  --amber:#ffc27d;
  --white:#fffaf1;
  --anomA:#18efff;
  --anomB:#6b61ff;
  --anomC:#ff35d4;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{cursor:none;user-select:none}
#scene{position:fixed;inset:0;overflow:hidden;background:#000}
#camera{position:absolute;inset:-1.5%;transform-origin:center;will-change:transform}
#worldCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#stars{position:absolute;inset:0;z-index:2;pointer-events:none}
.star{position:absolute;width:1px;height:1px;background:rgba(255,220,185,.55);border-radius:50%;box-shadow:0 0 7px rgba(255,175,90,.28);animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.04;transform:scale(.35)}50%{opacity:var(--o);transform:scale(1.8)}}
#portal{position:absolute;left:50%;top:50%;width:min(60vmin,720px);height:min(60vmin,720px);transform:translate(-50%,-50%);z-index:8;pointer-events:none}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,150,45,.09)}
.r1{width:100%;height:100%;animation:rot1 48s linear infinite;border-color:rgba(255,110,12,.07);box-shadow:0 0 20px rgba(255,90,0,.025)}
.r2{width:92%;height:92%;border-style:dashed;border-color:rgba(255,200,145,.06);animation:rot2 35s linear infinite}
.r3{width:78%;height:78%;border-color:rgba(255,125,15,.13);box-shadow:inset 0 0 25px rgba(255,95,0,.035),0 0 35px rgba(255,85,0,.045);animation:rot1 25s linear infinite}
.r4{width:66%;height:66%;border-style:dotted;border-color:rgba(255,225,195,.09);animation:rot2 17s linear infinite}
.r5{width:51%;height:51%;border-color:rgba(255,118,8,.14);animation:rot1 12s linear infinite}
@keyframes rot1{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rot2{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0)}}
#portalAura{position:absolute;left:50%;top:50%;width:48%;height:48%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,188,116,.075) 12%,rgba(255,97,7,.045) 30%,transparent 72%);filter:blur(9px);animation:aura 3.7s ease-in-out infinite}
@keyframes aura{0%,100%{transform:translate(-50%,-50%) scale(.82);opacity:.35}50%{transform:translate(-50%,-50%) scale(1.14);opacity:1}}
#portalHole{position:absolute;left:50%;top:50%;width:25%;height:25%;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 20px rgba(255,113,13,.18),0 0 65px rgba(255,70,0,.08),inset 0 0 18px rgba(255,120,20,.05)}
#coreRing{position:absolute;left:50%;top:50%;width:35%;height:35%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,195,135,.16);box-shadow:0 0 20px rgba(255,105,10,.06);animation:corePulse 2.8s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.07);opacity:1}}
#portalReaction{position:absolute;left:50%;top:50%;width:35%;height:35%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(0,0,0,0);opacity:0}
#portalReaction.go{animation:react 1.15s ease-out forwards}
@keyframes react{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9;border-color:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.65),0 0 28px rgba(255,120,15,.45)}45%{opacity:.25}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}
#rune{position:absolute;left:50%;top:50%;width:min(25vmin,305px);height:min(25vmin,305px);min-width:150px;min-height:150px;transform:translate(-50%,-50%);z-index:15;display:flex;align-items:center;justify-content:center;will-change:transform,opacity,filter}
#rune svg{width:100%;height:100%;overflow:visible}
.rune-path{fill:none;stroke:url(#runeGradient);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.rune-thin{fill:none;stroke:#fff9f0;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.rune-orange{fill:none;stroke:#ff7d15;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rune-solid{fill:#fffaf0}
#rune.show{animation:runeShow 2s cubic-bezier(.18,.8,.2,1) forwards}
@keyframes runeShow{0%{opacity:0;transform:translate(-50%,-50%) scale(.62) rotate(-12deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}12%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 4px rgba(255,255,255,1)) drop-shadow(0 0 10px rgba(255,230,195,1)) drop-shadow(0 0 23px rgba(255,150,45,.98)) drop-shadow(0 0 52px rgba(255,70,0,.72))}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 0 5px rgba(255,255,255,1)) drop-shadow(0 0 13px rgba(255,220,180,1)) drop-shadow(0 0 28px rgba(255,145,38,1)) drop-shadow(0 0 65px rgba(255,62,0,.78))}100%{opacity:0;transform:translate(-50%,-50%) scale(1.13) rotate(7deg);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,80,0,0))}}
#scan{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.025;background:repeating-linear-gradient(to bottom,rgba(255,160,80,.12) 0,rgba(255,160,80,.12) 1px,transparent 2px,transparent 5px);mix-blend-mode:screen}
#vignette{position:absolute;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.22) 59%,rgba(0,0,0,.66) 100%)}
#soundHint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;color:rgba(220,235,255,.35);font:10px Arial,sans-serif;letter-spacing:4px;opacity:0;transition:opacity .5s;pointer-events:none}
#soundHint.show{opacity:1}
</style>
</head>

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v));}
function smooth(v){v=clamp(v);return v*v*(3-2*v);}
function easeOut(v){v=clamp(v);return 1-Math.pow(1-v,3);}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function sideCx(side){return side==='L'?W*.21:W*.79;}
function sideBounds(side){return side==='L'?{l:W*.015,r:W*.405}:{l:W*.595,r:W*.985};}
function ep(now){return clamp((now-cycleStart)/CYCLE);}

for(let i=0;i<150;i++){
  const s=document.createElement('div');s.className='star';

  s.style.animationDelay=(-hash(i*9.3)*8)+'s';starsEl.appendChild(s);
}

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=Math.max(320,innerWidth);H=Math.max(240,innerHeight);
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize,{passive:true});resize();

function glow(x,y,r,color,a){
  if(a<=0)return;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(.18,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1;
}

  for(let i=0;i<17;i++){
    const x0=b.l+(i/16)*(b.r-b.l)+Math.sin(i*1.7+(side==='R'?1:0))*8;
    const bw=24+hash(i*4.4+(side==='R'?900:0))*47;
    const baseH=80+hash(i*8.3+(side==='R'?120:0))*190;
    const mid=x0+bw*.5;
    const dist=Math.abs(mid-cx);
    let visible=1,jit=0,lift=0,rot=0;
    if(type===0){const vanish=smooth(clamp((progress-.08)/.62));visible=1-vanish*(.30+.70*clamp(1-dist/(W*.22)));jit=Math.sin(now*.02+i)*8*vanish;lift=vanish*32*clamp(1-dist/(W*.25))}
    if(type===1){visible=.78+.18*Math.sin(now*.018+i);jit=Math.sin(now*.025+i)*4}
    if(type===2){const pull=clamp(1-dist/(W*.30));visible=1-smooth(clamp((progress-.12)/.55))*(pull*.9);jit=(cx-mid)*smooth(clamp(pull*.8))*.42;lift=42*pull*smooth(clamp((progress-.05)/.95));rot=(cx-mid)*.00055*pull}
    if(type===3){visible=.74+.2*Math.sin(now*.004+i*1.4);lift=36+Math.sin(now*.002+i*1.2)*17}
    if(type===4){const col=smooth(clamp((progress-.04)/.58));visible=1-col*(.35+.65*clamp(1-dist/(W*.24)));jit=(cx-mid)*col*.35;lift=col*24}
    if(type===5){const blast=smooth(clamp((progress-.02)/.32));visible=1-blast*.78; jit=Math.sin(now*.055+i*2)*blast*18; lift=Math.cos(now*.045+i)*blast*13}
    if(type===6){visible=.60+.40*(.5+.5*Math.sin(now*.02+i));jit=Math.sin(now*.035+i*3)*12}
    if(visible<.045)continue;
    const bh=baseH*(.95+.12*Math.sin(i*2.3))*(1-.14*Math.max(0,1-visible));
    const x=x0+jit,y=horizon-bh-lift;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.globalAlpha=alpha*visible*.82;
    const body=ctx.createLinearGradient(0,0,0,bh);body.addColorStop(0,'rgba(21,29,43,.98)');body.addColorStop(.65,'rgba(7,12,19,.98)');body.addColorStop(1,'rgba(2,5,9,1)');ctx.fillStyle=body;
    ctx.beginPath();ctx.moveTo(0,3);
    if(i%5===0){ctx.lineTo(bw*.48,-18);ctx.lineTo(bw,-1)}else if(i%5===1){ctx.lineTo(bw*.76,-11);ctx.lineTo(bw,1)}else{ctx.lineTo(bw,0)}
    ctx.lineTo(bw,bh);ctx.lineTo(0,bh);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(80,125,170,.22)';ctx.lineWidth=1;ctx.globalAlpha*=.65;
    for(let r=1;r<4;r++){const yy=bh*r/4;ctx.beginPath();ctx.moveTo(4,yy);ctx.lineTo(bw-4,yy);ctx.stroke()}
    const rows=Math.max(3,Math.floor(bh/20)),cols=Math.max(2,Math.floor(bw/13));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const q=hash(i*83+r*17+c*31+(side==='R'?701:13));if(q>.66){ctx.fillStyle=q>.90?'rgba(80,200,255,.34)':'rgba(186,210,232,.10)';ctx.fillRect(5+c*12,7+r*17,4,6)}}
    if(type===0&&visible<.85){ctx.globalAlpha=alpha*(1-visible)*.5;ctx.strokeStyle=pal.a;ctx.lineWidth=1.2;for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(2,bh*(.18+k*.17));ctx.lineTo(bw*(.30+.4*hash(i*4+k)),bh*(.19+k*.17));ctx.stroke()}}
    if(type===2&&visible<.95){ctx.globalAlpha=alpha*(1-visible)*.7;ctx.strokeStyle=pal.b;ctx.beginPath();ctx.moveTo(bw*.1,bh*.2);ctx.lineTo(bw*.9,bh*.8);ctx.moveTo(bw*.85,bh*.18);ctx.lineTo(bw*.15,bh*.72);ctx.stroke()}
    ctx.restore();
  }
  ctx.globalAlpha=alpha*.13;ctx.strokeStyle=pal.b;ctx.lineWidth=1;
  for(let i=0;i<7;i++){const y=horizon+9+i*13;ctx.beginPath();ctx.moveTo(b.l,y);ctx.quadraticCurveTo(cx,y-16,b.r,y);ctx.stroke()}
  ctx.restore();
}

function drawCar(x,y,scale,rot,pal,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);ctx.globalAlpha=a;
  ctx.fillStyle='rgba(6,11,18,.98)';
  ctx.beginPath();ctx.moveTo(-22,5);ctx.lineTo(-14,-5);ctx.lineTo(-3,-8);ctx.lineTo(8,-6);ctx.lineTo(21,2);ctx.lineTo(18,8);ctx.lineTo(-19,8);ctx.closePath();ctx.fill();
  ctx.fillStyle=pal.a;ctx.globalAlpha=a*.34;ctx.fillRect(-8,-4,12,3);ctx.fillStyle=pal.c;ctx.globalAlpha=a*.44;ctx.fillRect(8,1,6,3);
  ctx.restore();
}

function drawCars(side,alpha,now,type,progress,pal){
  const b=sideBounds(side),cx=sideCx(side),base=H*.79;
  for(let i=0;i<7;i++){
    const t=(i*.15+now*.00002*(.8+i*.1))%1;let x=b.l+t*(b.r-b.l),y=base,rot=side==='L'?0:Math.PI,a=alpha*.60,sc=.55+(i%3)*.08;
    if(type===0){const v=smooth(clamp((progress-.18)/.62));const q=clamp(1-Math.abs(x-cx)/(W*.23));x+=(cx-x)*v*q*.65;y+=v*q*45;a*=1-v*q*.9}
    if(type===1){y=base-8-Math.sin(now*.004+i)*10;a*=.65+.3*Math.sin(now*.003+i)**2}
    if(type===2){const q=clamp(1-Math.abs(x-cx)/(W*.29));x+=(cx-x)*q*.55;y-=q*90*progress;rot+=(cx-x)*.004*q;a*=1-q*.85}
    if(type===3){y-=100+Math.sin(now*.0022+i)*60;rot+=(i-3)*.12+Math.sin(now*.0017+i)*.18;a*=.92}
    if(type===4){const q=smooth(clamp((progress-.03)/.65));x+=(cx-x)*q*.8;y+=(H*.57-y)*q*.15;a*=1-q*.7}
    if(type===5){const blast=smooth(clamp((progress-.06)/.28));x+=(x<cx?-1:1)*blast*70;y-=blast*80;rot+=(i-3)*blast*.26;a*=1-blast*.7}
    if(type===6){x+=Math.sin(now*.018+i)*18;rot+=Math.sin(now*.014+i)*.08}
    drawCar(x,y,sc,rot,pal,a);
  }
}

function drawHuman(x,y,s,pal,a,phase,ghost){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;
  ctx.fillStyle='rgba(7,11,18,.97)';ctx.beginPath();ctx.arc(0,-18,5.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,-11);ctx.quadraticCurveTo(0,-16,7,-11);ctx.lineTo(6,8);ctx.lineTo(0,16);ctx.lineTo(-6,8);ctx.closePath();ctx.fill();
  ctx.strokeStyle=pal.a;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-5);ctx.lineTo(-11,2+Math.sin(phase)*2);ctx.moveTo(4,-5);ctx.lineTo(11,2-Math.sin(phase)*2);ctx.moveTo(-2,13);ctx.lineTo(-8,24);ctx.moveTo(2,13);ctx.lineTo(8,24);ctx.stroke();
  if(ghost>0){ctx.globalAlpha=a*ghost*.48;ctx.strokeStyle=pal.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-4,22,0,TAU);ctx.stroke()}
  ctx.restore();
}

function drawPeople(side,alpha,now,type,progress,pal){
  const b=sideBounds(side),cx=sideCx(side),base=H*.77;
  for(let i=0;i<8;i++){
    let x=b.l+(i*.127+.05)*(b.r-b.l),y=base-(i%2)*6,a=alpha*.7,s=.65+(i%3)*.08,ghost=0;
    if(type===0){const v=smooth(clamp((progress-.1)/.65));const q=clamp(1-Math.abs(x-cx)/(W*.24));x+=(cx-x)*v*q*.7;y-=v*q*50;a*=1-v*q*.96;ghost=v*q}
    if(type===1){const ph=(progress*1.7+i*.19)%1;const vis=ph<.38?Math.sin(ph/.38*Math.PI):ph>.80?Math.sin((1-ph)/.2*Math.PI):.15;x=cx+(i-3.5)*48+Math.sin(now*.002+i)*7;y=base-18-Math.abs(Math.sin(ph*Math.PI))*45;a*=vis;ghost=1-vis}
    if(type===2){const q=clamp(1-Math.abs(x-cx)/(W*.30));x+=(cx-x)*q*.65;y-=q*55*progress;a*=1-q*.88;ghost=q}
    if(type===3){y-=70+Math.sin(now*.002+i)*45;a*=.9}
    if(type===4){const q=smooth(clamp(progress/.75));x+=(cx-x)*q;y+=(H*.56-y)*q*.08;a*=1-q*.9;ghost=q}
    if(type===5){const q=smooth(clamp((progress-.05)/.30));x+=(x<cx?-1:1)*q*80;y-=q*70;a*=1-q*.86}
    if(type===6){x+=Math.sin(now*.03+i)*10;y+=Math.cos(now*.022+i)*8}
    drawHuman(x,y,s,pal,a,now*.003+i,ghost);
  }
}

function drawBlackHole(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.49,R=92+24*Math.sin(now*.003);const open=smooth(clamp(progress/.18));const close=1-smooth(clamp((progress-.82)/.16));const life=open*close;
  ctx.save();ctx.globalCompositeOperation='screen';
  glow(cx,cy,R*2.8,pal.b,.045*a*life);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.9);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.42,'rgba(0,0,0,1)');g.addColorStop(.56,pal.c+'30');g.addColorStop(.66,pal.a+'27');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=a*life;ctx.beginPath();ctx.arc(cx,cy,R*1.9,0,TAU);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(now*.00045*(side==='L'?1:-1));
  for(let k=0;k<6;k++){ctx.strokeStyle=k%2?pal.a:pal.c;ctx.globalAlpha=a*life*(.24-k*.03);ctx.lineWidth=k===0?6:1.6;ctx.beginPath();ctx.ellipse(0,0,R*(.92+k*.10),R*(.24+k*.045),0,0,TAU);ctx.stroke()}
  ctx.restore();
  for(let i=0;i<130;i++){const ang=i*TAU/130+now*.0014;const rr=R*(1.15+hash(i*2.1+(side==='L'?3:11))*.95);const pull=Math.pow(clamp((R*3-rr)/(R*3)),1.5);const px=cx+Math.cos(ang)*rr*(1-.62*pull),py=cy+Math.sin(ang)*rr*.43*(1-.62*pull);ctx.fillStyle=i%2?pal.a:pal.c;ctx.globalAlpha=a*life*(.05+.25*pull);ctx.fillRect(px,py,1.5+hash(i)*2,1.5+hash(i*2)*2)}
  for(let j=0;j<9;j++){ctx.strokeStyle=pal.a;ctx.globalAlpha=a*life*.13;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R+16+j*11,-1.1+j*.03,1.1+j*.03);ctx.stroke()}
  ctx.restore();
}

function drawTeleport(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.58,fadeIn=smooth(clamp(progress/.16)),fadeOut=1-smooth(clamp((progress-.78)/.18));
  ctx.save();ctx.globalCompositeOperation='screen';
  glow(cx,cy,190,pal.a,.03*a*fadeIn*fadeOut);
  const rr=84+18*Math.sin(now*.003);
  for(let k=0;k<6;k++){ctx.strokeStyle=k%2?pal.a:pal.c;ctx.globalAlpha=a*fadeIn*fadeOut*(.16-k*.018);ctx.lineWidth=k===0?4:1.2;ctx.beginPath();ctx.ellipse(cx,cy,rr+k*13,rr*.38+k*3,0,0,TAU);ctx.stroke()}
  ctx.strokeStyle=pal.a;ctx.globalAlpha=a*.7*fadeIn*fadeOut;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy-130);ctx.lineTo(cx,cy+110);ctx.stroke();ctx.restore();
}

function drawLevitation(side,a,now,pal){
  const cx=sideCx(side),base=H*.76;
  ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<4;i++){const x=cx+(i-1.5)*78+Math.sin(now*.0015+i)*12,y=base-80-Math.sin(now*.0021+i)*60;drawCar(x,y,.78+i*.03,(i-1.5)*.22+Math.sin(now*.001+i)*.18,pal,a*.85);ctx.strokeStyle=i%2?pal.a:pal.c;ctx.globalAlpha=a*.25;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-28,y+15);ctx.lineTo(x+28,y+15);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+17);ctx.lineTo(x,y+48);ctx.stroke()}
  ctx.restore();
}

function drawCollapse(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.56,col=smooth(clamp((progress-.03)/.64)),vanish=smooth(clamp((progress-.68)/.26));
  ctx.save();ctx.globalCompositeOperation='screen';glow(cx,cy,220,pal.c,.035*a*col);
  for(let i=0;i<220;i++){const ox=(i%20-9.5)*14,oy=(Math.floor(i/20)-5.5)*14;const swirl=Math.sin(now*.004+i)*11*(1-col);const x=cx+ox*(1-col*.96)+Math.cos(oy*.02)*swirl;const y=cy+oy*(1-col*.96)+Math.sin(ox*.02)*swirl;ctx.fillStyle=i%3===0?pal.a:i%3===1?pal.b:pal.c;ctx.globalAlpha=a*(.035+.18*hash(i*1.7))*(1-vanish*.98);ctx.fillRect(x,y,1.8+3*(1-col),1.8+3*(1-col))}
  const core=18+52*col;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,core);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.16,pal.a);g.addColorStop(.55,pal.c+'25');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=a*col*(1-vanish*.9);ctx.beginPath();ctx.arc(cx,cy,core,0,TAU);ctx.fill();ctx.restore();
}

function drawExplosion(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.59,p=clamp(progress/2.35),grow=easeOut(p),fade=1-smooth(clamp((p-.48)/.52)),R=24+195*grow;
  ctx.save();ctx.globalCompositeOperation='screen';
  glow(cx,cy,R*1.4,pal.a,.13*a*fade);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.09,pal.a);g.addColorStop(.22,pal.c);g.addColorStop(.52,pal.b+'35');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=a*fade;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  for(let k=0;k<4;k++){ctx.strokeStyle=k%2?pal.a:pal.c;ctx.globalAlpha=a*fade*(.3-k*.055);ctx.lineWidth=k===0?4:1.3;ctx.beginPath();ctx.arc(cx,cy,R*(.46+k*.18),0,TAU);ctx.stroke()}
  for(let i=0;i<115;i++){const ang=i*TAU/115+grow*5;const rr=15+grow*(40+hash(i*2.4)*210);const x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr*.75;ctx.fillStyle=i%3===0?pal.a:i%3===1?pal.b:pal.c;ctx.globalAlpha=a*fade*(.04+.42*hash(i*5.2));ctx.fillRect(x,y,1.5+hash(i)*3.5,1.5+hash(i*2)*3.5)}
  ctx.restore();
}

function drawRift(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.50,open=smooth(clamp(progress/.20)),close=1-smooth(clamp((progress-.77)/.20)),life=open*close;
  ctx.save();ctx.globalCompositeOperation='screen';glow(cx,cy,240,pal.b,.05*a*life);
  for(let k=0;k<10;k++){
    const off=(k-4.5)*12;ctx.strokeStyle=k%3===0?pal.c:(k%2?pal.a:pal.b);ctx.globalAlpha=a*life*(.14+.045*(k%3));ctx.lineWidth=k===0?4:1.25;ctx.beginPath();ctx.moveTo(cx+off*.25,cy-190);ctx.lineTo(cx+off+Math.sin(now*.003+k)*28,cy-92);ctx.lineTo(cx+off*.15,cy);ctx.lineTo(cx+off+Math.cos(now*.002+k)*22,cy+84);ctx.lineTo(cx+off*.25,cy+190);ctx.stroke()}
  for(let i=0;i<115;i++){const y=cy-190+i*3.25;const x=cx-105+hash(i*2.8)*210+Math.sin(now*.007+i)*12;ctx.fillStyle=i%2?pal.a:pal.c;ctx.globalAlpha=a*life*(.02+.11*hash(i*4.6));ctx.fillRect(x,y,10+hash(i*2.1)*85,1+hash(i)*2)}
  ctx.restore();
}

function drawFractureDust(side,a,now,pal,progress){
  const cx=sideCx(side),cy=H*.58,v=smooth(clamp((progress-.12)/.7));
  ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<180;i++){const ang=hash(i*2.8)*TAU,rr=38+hash(i*6.1)*180;const px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr*.55;const pull=v*(.5+.5*hash(i*4.3));const x=px+(cx-px)*pull*.82,y=py+(cy-py)*pull*.82;ctx.fillStyle=i%2?pal.a:pal.c;ctx.globalAlpha=a*v*(.018+.18*hash(i*9.2));ctx.fillRect(x,y,1.2+hash(i)*2.7,1.2+hash(i*3)*2.7)}
  ctx.restore();
}

function drawEvent(side,type,a,now){
  const pal=palettes[type%palettes.length],p=ep(now);if(a<=.001)return;
  drawCity(side,a*.95,now,type,p,pal);drawPeople(side,a,now,type,p,pal);drawCars(side,a,now,type,p,pal);
  if(type===0){drawRift(side,a,now,pal,p);drawFractureDust(side,a,now,pal,p)}
  if(type===1)drawTeleport(side,a,now,pal,p);
  if(type===2)drawBlackHole(side,a,now,pal,p);
  if(type===3)drawLevitation(side,a,now,pal);
  if(type===4)drawCollapse(side,a,now,pal,p);
  if(type===5)drawExplosion(side,a,now,pal,p);
  if(type===6)drawRift(side,a,now,pal,p);
}

function drawTransition(side,now,a,type){
  const pal=palettes[type%palettes.length],cx=sideCx(side),p=ep(now),entry=smooth(clamp(p/.19)),exit=1-smooth(clamp((p-.80)/.20)),life=entry*exit;
  if(life<=.01)return;
  ctx.save();ctx.globalCompositeOperation='screen';
  const w=(90+230*Math.sin(Math.PI*entry))*life;
  const g=ctx.createLinearGradient(cx-w,0,cx+w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,pal.a+'10');g.addColorStop(.5,pal.a+'50');g.addColorStop(.65,pal.c+'10');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=a*.9;ctx.fillRect(cx-w,H*.1,w*2,H*.72);
  for(let i=0;i<18;i++){const y=H*.14+i*37+Math.sin(now*.006+i)*8;ctx.strokeStyle=i%2?pal.a:pal.c;ctx.globalAlpha=a*life*(.025+.025*(i%4));ctx.lineWidth=i%5===0?2:1;ctx.beginPath();ctx.moveTo(cx-w,y);ctx.lineTo(cx+w,y+Math.sin(now*.004+i)*7);ctx.stroke()}
  ctx.restore();
}

function changeCycle(now){
  state.prevLeft=state.left;state.prevRight=state.right;cycleIndex=(cycleIndex+1)%pairs.length;state.left=pairs[cycleIndex][0];state.right=pairs[cycleIndex][1];cycleStart=now;reaction.classList.remove('go');void reaction.offsetWidth;reaction.classList.add('go');
}

function loop(now){
  if(now-cycleStart>=CYCLE)changeCycle(now);
  ctx.clearRect(0,0,W,H);
  const p=ep(now);let inA=1,outA=0;
  if(p<TRANSITION/CYCLE){inA=smooth(p/(TRANSITION/CYCLE));outA=1-inA}else if(p>1-TRANSITION/CYCLE){outA=smooth((p-(1-TRANSITION/CYCLE))/(TRANSITION/CYCLE));inA=1-outA}
  drawEvent('L',state.prevLeft,outA,now);drawEvent('R',state.prevRight,outA,now);drawEvent('L',state.left,inA,now);drawEvent('R',state.right,inA,now);
  drawTransition('L',now,inA,state.left);drawTransition('R',now,inA,state.right);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showRune(){runeEl.classList.remove('show');void runeEl.offsetWidth;runeEl.innerHTML=runes[runeIndex];runeEl.classList.add('show');runeIndex=(runeIndex+1)%runes.length}
showRune();setInterval(showRune,2000);

let mx=0,my=0,tx=0,ty=0;
addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});
function cameraLoop(t){mx+=(tx-mx)*.018;my+=(ty-my)*.018;const q=t*.00022;camera.style.transform=`translate3d(${Math.sin(q*1.2)*1.7+mx*2.7}px,${Math.cos(q*.9)*1.7+my*2.7}px,0) scale(${1.003+Math.sin(q)*.002})`;requestAnimationFrame(cameraLoop)}
requestAnimationFrame(cameraLoop);

let audioReady=false;
function activateSound(){
  if(!audioReady){music.src='dave-deville-investigate-loopable.mp3';music.volume=.34;audioReady=true}
  music.play().then(()=>soundHint.classList.remove('show')).catch(()=>{soundHint.classList.add('show');setTimeout(()=>soundHint.classList.remove('show'),2600)});
}
addEventListener('pointerdown',activateSound,{once:true});addEventListener('keydown',activateSound,{once:true});addEventListener('touchstart',activateSound,{once:true,passive:true});
</script>
